name: karst-client-linux
arch: ${ARCH}
platform: linux
version: "${VERSION}"
release: "1"
section: net
priority: optional
maintainer: Karst contributors <maintainers@karst.net>
description: Karst node agent and command-line client
license: MIT OR Apache-2.0
contents:
  - src: dist/karstd
    dst: /usr/bin/karstd
    file_info:
      mode: 0755
  - src: dist/karst
    dst: /usr/bin/karst
    file_info:
      mode: 0755
  - src: packaging/systemd/karstd.service
    dst: /usr/lib/systemd/system/karstd.service
  - dst: /etc/karst
    type: dir
    file_info:
      mode: 0755
  # The netmap cache lives here (`[control] cache_file` in
  # docs/GETTING-STARTED.md §6.3) and it holds one pre-shared key per peer, so
  # 0700 is a confidentiality boundary rather than tidiness — THREAT-MODEL R5.
  # Shipped as package content and not created in a postinstall so that the
  # mode is declared once and `rpm --verify` can check it.
  - dst: /var/lib/karst
    type: dir
    file_info:
      mode: 0700

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove-karstd.sh
  postremove: packaging/scripts/postremove.sh
