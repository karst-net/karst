name: karst-client
arch: amd64
platform: linux
version: "${VERSION}"
release: "1"
section: net
priority: optional
maintainer: Karst contributors <maintainers@karst.net>
description: Karst node agent and command-line client
license: MIT OR Apache-2.0
contents:
  - src: dist/karstd
    dst: /usr/bin/karstd
    file_info:
      mode: 0755
  - src: dist/karst
    dst: /usr/bin/karst
    file_info:
      mode: 0755
  - src: packaging/systemd/karstd.service
    dst: /usr/lib/systemd/system/karstd.service
  - dst: /etc/karst
    type: dir
    file_info:
      mode: 0755
