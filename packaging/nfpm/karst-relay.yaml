name: karst-relay
arch: ${ARCH}
platform: linux
version: "${VERSION}"
release: "${RELEASE}"
section: net
priority: optional
maintainer: Karst contributors <maintainers@karst.net>
description: Karst Ponor relay service
license: MIT OR Apache-2.0
contents:
  - src: dist/karst-relay
    dst: /usr/bin/karst-relay
    file_info:
      mode: 0755
  - src: packaging/systemd/karst-relay.service
    dst: /usr/lib/systemd/system/karst-relay.service
  - dst: /etc/karst
    type: dir
    file_info:
      mode: 0755

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove-karst-relay.sh
  postremove: packaging/scripts/postremove.sh
