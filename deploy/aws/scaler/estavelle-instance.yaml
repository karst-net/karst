#
# One karst-estavelle ECS service for exactly one estavelle allocation
# (ADR-0063; ADR-0067's CloudFormation actuation path) -- Fargate Spot by
# default, or EC2-backed (see ComputeType below) when the connection's own
# launch defaults target a Local Zone, which Fargate cannot reach at all.
# Launched and torn down only by server/management/internals/karst/
# infraprovision/cloudformationdriver -- the Go source there embeds this
# exact content as a string constant (go:embed cannot reach outside that
# Go module's own tree up to here, so the two are kept byte-identical by
# hand; see that package's own doc comment). Never run this by hand against
# a real account -- it exists here only so the actual template is
# reviewable outside the Go source.
#
# Depends on the one-time prerequisites in estavelle-launch-defaults.yaml
# (cluster, execution role, log group, security group, and -- only when
# that stack's own ComputeType is ec2 -- the EC2 capacity provider this
# template's ComputeType must then also name) already existing.
# ClusterArn/ExecutionRoleArn/Cpu/Memory/LogGroup/SubnetId/SecurityGroupIds
# are exactly the AWS infrastructure connection's own stored launch
# defaults (Settings -> Infrastructure connections), passed straight
# through by the driver unchanged. Image is the estavelle allocation's own
# desired/running image -- a real ghcr.io/karst-net/karst-estavelle:<tag>
# reference, since every release already publishes one
# (.github/workflows/deliverables.yml) -- never an AMI id: Fargate needs no
# AMI-build pipeline at all, and the EC2 path's own AMI is
# estavelle-launch-defaults.yaml's concern (resolved at deploy time from
# AWS's own published ECS-optimized image), never this stack's.
#
# There is no UserData/cloud-init step here either way: Fargate has no boot
# script of its own to run one in, and an EC2-backed instance's own
# ECS-agent-registration UserData lives in estavelle-launch-defaults.yaml,
# not per-allocation. Enrollment instead happens in-binary --
# bins/karst-estavelle/src/main.rs's command_run checks for
# KARST_CONTROL_API_BASE/KARST_ENROLL_TOKEN/KARST_TLS_SERVER_NAME and
# self-enrolls before serving, the same convention kubernetesdriver already
# established for container-based actuation (see that package's own doc
# comment).
#
# Fargate's awsvpc networking gives every task its own ENI with its own
# public IP (AssignPublicIp). Plain EC2 launch type tasks using awsvpc
# never get a public IP on their own ENI at all (confirmed against AWS's
# own ECS task-networking docs) -- only the underlying instance's primary
# ENI can have one. So the EC2 path uses bridge networking instead:
# ordinary Docker port mapping onto the host instance's own ports, with
# the security group living on the instance/launch-template (already true
# in estavelle-launch-defaults.yaml) rather than per-task. This is also
# why the EC2 path needs no per-service NetworkConfiguration at all --
# that property only ever applies to awsvpc mode.

AWSTemplateFormatVersion: "2010-09-09"

Description: >
  One estavelle ECS service (Fargate Spot, or EC2-backed for a Local Zone)
  for one estavellealloc allocation -- driven only by cloudformationdriver,
  never deployed by hand.

Parameters:
  ClusterArn:
    Type: String
  ExecutionRoleArn:
    Type: String
  Cpu:
    Type: String
  Memory:
    Type: String
  LogGroup:
    Type: String
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
  Image:
    Type: String
    Description: >
      ghcr.io/karst-net/karst-estavelle:<release tag> -- the allocation's
      own desired/running image, passed through unchanged.
  PoolId:
    Type: String
    Description: estavellealloc's own allocation id -- the karst:pool tag value.
  TlsServerName:
    Type: String
    Description: >
      infraprovision.TLSServerNameFor's own derived correlation label --
      the karst:tls-server-name tag value the driver reads back via
      TLSServerName/Drain/Destroy, and the same value passed to the
      container as KARST_TLS_SERVER_NAME for self-enrollment.
  ControlApiBase:
    Type: String
  EnrollToken:
    Type: String
    NoEcho: true
    Description: >
      A single-use relay-enroll token (ADR-0045 Sec7 Phase 2). NoEcho is
      correct here (a Parameter, not an Output -- see
      estavelle-launch-defaults.yaml's own note on why that distinction
      matters).
  ControlApiCaPem:
    Type: String
    Default: ""
    Description: >
      Optional additional trust anchor (PEM text) for the container's own
      enroll call to ControlApiBase -- empty (the default, every
      deployment behind a publicly-issued certificate) means the
      container's OS trust store alone must validate it. Not a secret: a
      CA certificate, unlike EnrollToken, is public by design -- no NoEcho.
  PullCredentialsSecretArn:
    Type: String
    Default: ""
    Description: >
      Optional AWS Secrets Manager secret ARN (holding
      {"username","password"}) the task execution role may read to pull a
      private ghcr.io/karst-net/karst-estavelle image -- empty (the
      default) means an anonymous/public pull. The secret itself, and the
      execution role's permission to read it, are provisioned out-of-band
      by estavelle-launch-defaults.yaml -- this parameter only carries the
      ARN through to this one stack's own RepositoryCredentials.
  ComputeType:
    Type: String
    Default: fargate
    AllowedValues: [fargate, ec2]
    Description: >
      Must match the connection's own launch defaults (and therefore
      estavelle-launch-defaults.yaml's own ComputeType for this cluster).
      ec2 only for a Local Zone target -- see this file's own header
      comment for why that path uses bridge networking instead of awsvpc.
  Ec2CapacityProviderName:
    Type: String
    Default: ""
    Description: >
      Required when ComputeType=ec2 -- estavelle-launch-defaults.yaml's
      own Ec2CapacityProviderName output, via the connection's launch
      defaults. Ignored (and left empty) for the default, fargate, path.

Conditions:
  HasPullCredentials: !Not [!Equals [!Ref PullCredentialsSecretArn, ""]]
  UseEc2Capacity: !Equals [!Ref ComputeType, ec2]

Resources:
  EstavelleTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      # A fixed family name, not CloudFormation's own default (derived from
      # logical id + stack name): AllocatorPolicy's own
      # RegisterTaskDefinition statement in estavelle-launch-defaults.yaml
      # scopes to this exact "karst-estavelle-*" ARN pattern, the same
      # convention stackNameFor already uses.
      Family: !Sub "karst-estavelle-${PoolId}"
      RequiresCompatibilities: !If [UseEc2Capacity, [EC2], [FARGATE]]
      NetworkMode: !If [UseEc2Capacity, bridge, awsvpc]
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !Ref ExecutionRoleArn
      ContainerDefinitions:
        - Name: karst-estavelle
          Image: !Ref Image
          Essential: true
          # Fn::If with the false branch as AWS::NoValue omits this
          # property entirely for the (default, public-image) case, rather
          # than passing an empty CredentialsParameter ECS would try and
          # fail to resolve as a real secret ARN.
          RepositoryCredentials: !If
            - HasPullCredentials
            - CredentialsParameter: !Ref PullCredentialsSecretArn
            - !Ref "AWS::NoValue"
          # HostPort == ContainerPort is valid either way: ignored under
          # awsvpc (the ENI's own port is used regardless), load-bearing
          # under bridge -- see this file's own header comment on why the
          # EC2 path is bridge, not awsvpc.
          PortMappings:
            - ContainerPort: 443
              HostPort: 443
              Protocol: tcp
            - ContainerPort: 443
              HostPort: 443
              Protocol: udp
          Environment:
            - Name: KARST_CONTROL_API_BASE
              Value: !Ref ControlApiBase
            - Name: KARST_ENROLL_TOKEN
              Value: !Ref EnrollToken
            - Name: KARST_TLS_SERVER_NAME
              Value: !Ref TlsServerName
            - Name: KARST_CONTROL_API_CA_PEM
              Value: !Ref ControlApiCaPem
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: estavelle

  EstavelleService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ClusterArn
      TaskDefinition: !Ref EstavelleTaskDefinition
      DesiredCount: 1
      # Spot only, no on-demand fallback for the Fargate path: this
      # mechanism's whole point there is Spot's lower cost, and a Spot
      # interruption's replacement task is exactly what estavellealloc's
      # own drive_loop retry/reconciliation already handles for any other
      # failure mode. The EC2 path has no Spot/on-demand choice to make
      # here at all -- that lives in estavelle-launch-defaults.yaml's own
      # Auto Scaling Group, not this per-allocation Service.
      CapacityProviderStrategy: !If
        - UseEc2Capacity
        - - CapacityProvider: !Ref Ec2CapacityProviderName
            Weight: 1
        - - CapacityProvider: FARGATE_SPOT
            Weight: 1
      # Only ever meaningful for awsvpc mode -- omitted entirely (not an
      # empty/default value CloudFormation would still try to apply) for
      # the EC2 path's own bridge mode, whose networking is the launch
      # template's and security group's concern instead (both already set
      # in estavelle-launch-defaults.yaml).
      NetworkConfiguration: !If
        - UseEc2Capacity
        - !Ref "AWS::NoValue"
        - AwsvpcConfiguration:
            Subnets: [!Ref SubnetId]
            SecurityGroups: !Ref SecurityGroupIds
            AssignPublicIp: ENABLED
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - Key: "karst:pool"
          Value: !Ref PoolId
        - Key: "karst:tls-server-name"
          Value: !Ref TlsServerName

Outputs:
  ServiceArn:
    Value: !Ref EstavelleService
