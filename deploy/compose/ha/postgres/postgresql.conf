listen_addresses = '*'
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f'
restore_command = 'cp /var/lib/postgresql/wal-archive/%f %p'
hba_file = '/etc/postgresql/pg_hba.conf'
# Async by default. For RPO=0, enable synchronous_commit and name the standby.
#
# No archive_timeout: a WAL segment archives only on completion (16 MB) or an
# explicit switch, so under low write volume the actual RPO is bounded by
# time-since-last-full-segment, not replication lag — measured directly in a
# real restore drill (docs/operations/ha.md), not assumed. Uncomment for a
# bounded worst-case RPO, at the cost of a steady trickle of mostly-empty
# archived segments:
# archive_timeout = 60
