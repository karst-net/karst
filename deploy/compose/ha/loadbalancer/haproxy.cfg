#
# The shared entry point deploy/compose/ha/README.md says a client needs: TCP
# passthrough, not HTTP/1.1 termination — karst-control's control channel is
# plaintext h2c (docs/GETTING-STARTED.md §7.1), and HAProxy in `http` mode
# would try to parse it as HTTP/1.1 and fail. `mode tcp` here is a hard
# requirement, not a style choice.
#
# Edit the two placeholder `server` addresses below to the real host:port of
# each karst-control replica before use, per this directory's README.

global
    maxconn 4096
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # A control-channel session is held open for the life of the daemon
    # (bins/karstd/src/control.rs's "reconnect-with-backoff" design) — a
    # short client/server timeout here would silently sever a healthy,
    # merely-idle session and manufacture the exact failover event this
    # front end exists to survive, not cause.
    timeout client 24h
    timeout server 24h

frontend karst_control_in
    bind *:33073
    default_backend karst_control_replicas

backend karst_control_replicas
    balance roundrobin
    # A plain TCP connect is enough to route around a killed process (the
    # listener disappears with it); it does not validate the control
    # protocol itself. fall 2 / inter 1s: a dead replica is routed around
    # within about two seconds of the process dying, not one slow check
    # cycle later.
    option tcp-check
    default-server check inter 1s fall 2 rise 2
    server replica-a 203.0.113.10:33073
    server replica-b 203.0.113.20:33073
