#
# Karst login theme: a styles-only child of Keycloak's own keycloak.v2
# (PatternFly 5) login theme. Every .ftl template, script and message is
# inherited unchanged -- only the look is replaced -- so a Keycloak upgrade
# can't leave a forked template behind. See ../../README.md.
parent=keycloak.v2
import=common/keycloak

# `styles` replaces the parent's list rather than appending to it, so the
# parent's own stylesheet is listed first and ours layered on top. The
# parent's css/styles.css still resolves to keycloak.v2's copy: a child theme
# falls back to its parent for any resource it doesn't ship itself.
styles=css/styles.css css/karst.css

darkMode=true
