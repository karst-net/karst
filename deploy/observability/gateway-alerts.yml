# Load with Prometheus rule_files; scrape the node's loopback metrics listener
# through your existing collector, or collect `karst metrics` as a textfile.
groups:
  - name: karst-gateway
    rules:
      - alert: KarstGatewayForwardingDegraded
        expr: karst_gateway_offers{state="degraded"} > 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Gateway forwarding is degraded on {{ $labels.instance }}"
          description: "{{ $value }} authenticated Gateway offers lack active local forwarding. Inspect karst gateway status."
