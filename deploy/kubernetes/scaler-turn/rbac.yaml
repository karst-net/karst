#
# ADR-0045 §7b (issue #311): the namespace-scoped Role karst-scaler-turn-k8s
# needs, matching deploy/kubernetes/scaler/rbac.yaml's own precedent
# (namespace-scoped, not cluster-scoped) rather than inventing a new
# convention. See docs/operations/scaler-turn-k8s-driver.md for the full
# deployment picture this RBAC is one piece of.
#
# Narrower than the relay driver's own Role in one real way: no `delete`
# verb on pods. The relay driver's drain() deletes a pod directly (sends
# SIGTERM, which karst-relay's own shutdown handler acts on); this
# driver's drain() never deletes a Pod object at all -- it only patches
# the StatefulSet's own replicas field down (same as the relay driver's
# destroy()), and Kubernetes itself removes the resulting excess pod.
# One less permission granted for one less thing this driver can get
# wrong.
#
# No `services` verb anywhere, for the identical reason the relay
# driver's own Role has none: the headless Service each pool's
# StatefulSet needs is an operator-provisioned prerequisite (see the
# doc), not something this driver creates.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: karst-scaler-turn
  namespace: karst-turn
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: karst-scaler-turn
  namespace: karst-turn
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [""]
    resources: [pods]
    # list() reads pod names for its own Instance list; nothing in this
    # driver ever deletes a Pod object directly -- see this file's own
    # header comment.
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    # get+update only: the one bundle Secret per pool is created once by
    # the operator (empty, or pre-seeded -- see the doc), never by the
    # driver itself.
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: karst-scaler-turn
  namespace: karst-turn
subjects:
  - kind: ServiceAccount
    name: karst-scaler-turn
    namespace: karst-turn
roleRef:
  kind: Role
  name: karst-scaler-turn
  apiGroup: rbac.authorization.k8s.io
