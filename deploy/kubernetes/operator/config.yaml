---
apiVersion: v1
kind: Namespace
metadata:
  name: karst-system
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: karstnodes.karst.io
spec:
  group: karst.io
  scope: Namespaced
  names:
    plural: karstnodes
    singular: karstnode
    kind: KarstNode
    shortNames: [knode]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [image, configSecret]
              properties:
                image:
                  type: string
                  minLength: 1
                configSecret:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                    key:
                      type: string
                      default: karstd.toml
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
      subresources:
        status: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: karst-operator
  namespace: karst-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: karst-operator
  namespace: karst-system
rules:
  - apiGroups: [karst.io]
    resources: [karstnodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: karst-operator
  namespace: karst-system
subjects:
  - kind: ServiceAccount
    name: karst-operator
    namespace: karst-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: karst-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karst-operator
  namespace: karst-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karst-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karst-operator
    spec:
      serviceAccountName: karst-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/karst-net/karst-operator:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
