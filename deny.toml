# Enforces the dependency policy in LICENSING.md.
# A GPL dependency reaching the MIT/Apache crates would compromise both
# iOS App Store and kernel-datapath viability — hence a CI gate, not a
# review convention. See ADR-0003, ADR-0007.

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-DFS-2016", "Unicode-3.0", "CC0-1.0",
    # 0BSD reaches the tree through `smoltcp`'s `heapless` and `managed`
    # (ADR-0012). It is OSI-approved and strictly more permissive than MIT —
    # the same grant with the attribution requirement removed — so it imposes
    # nothing MIT does not already impose on a `MIT OR Apache-2.0` crate.
    # Added deliberately rather than discovered: a new license in the tree is a
    # decision, and this list is where the decision is recorded.
    "0BSD",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# A wildcard version on a crates.io dependency means an unreviewed upgrade can
# arrive silently, which is exactly the supply-chain risk this file exists to
# stop. Intra-workspace `path` dependencies carry no version by construction and
# are built from the tree in front of you, so they are not that risk.
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
