# Enforces the dependency policy in LICENSING.md.
# A GPL dependency reaching the MIT/Apache crates would compromise both
# iOS App Store and kernel-datapath viability — hence a CI gate, not a
# review convention. See ADR-0003, ADR-0007.

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-DFS-2016", "Unicode-3.0", "CC0-1.0",
    # 0BSD reaches the tree through `smoltcp`'s `heapless` and `managed`
    # (ADR-0012). It is OSI-approved and strictly more permissive than MIT —
    # the same grant with the attribution requirement removed — so it imposes
    # nothing MIT does not already impose on a `MIT OR Apache-2.0` crate.
    # Added deliberately rather than discovered: a new license in the tree is a
    # decision, and this list is where the decision is recorded.
    "0BSD",
    # MPL-2.0 reaches the tree through `uniffi` (`crates/karst-ffi`,
    # ADR-0029) — the mobile/macOS-NetworkExtension FFI boundary named in
    # ADR-0022. It is file-level copyleft: it obligates source availability
    # for modifications to MPL-covered files themselves, not for code that
    # links against them or for the application as a whole, so it imposes no
    # obligation on `karst-ffi`'s own MIT/Apache-2.0 code or on anyone
    # shipping `Karst.app`. See ADR-0029's Context for why this is a
    # deliberate inclusion, not an oversight.
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# A wildcard version on a crates.io dependency means an unreviewed upgrade can
# arrive silently, which is exactly the supply-chain risk this file exists to
# stop. Intra-workspace `path` dependencies carry no version by construction and
# are built from the tree in front of you, so they are not that risk.
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0370/-0371/-0372: zvariant, zvariant_derive and zbus_names were
# folded into zbus itself as of 6.0.0 and stopped shipping standalone
# releases -- "unmaintained", not a vulnerability; each advisory says "No
# safe upgrade is available!" for the crate it names. The real fix is
# karst-dns (crates/karst-dns/src/host/{networkmanager,resolved}.rs) moving
# off zbus 5's `zbus::blocking::{Connection, Proxy}` API, which zbus 6
# removed entirely in favour of an async-only `zruntime` runtime with a
# different feature set (no `async-io`/`blocking-api`) -- a NetworkManager/
# systemd-resolved D-Bus integration rewrite, not a version bump. Tracked as
# a real migration rather than done silently here; ignored for now so a
# newly-published advisory for an unrelated, unmaintained-but-unbroken
# transitive dependency doesn't block every PR in the meantime.
ignore = ["RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
