openapi: 3.0.3
info:
  title: Karst Control API
  version: 1.0.0-draft.1
  description: |
    Karst-owned administrative API. All paths inherit the management server's
    authentication middleware. Public keys may be represented by stable
    handles. This API never returns PSKs, discovery keys, or private node
    material. Enrollment issuance returns a single-use bearer credential once;
    list and status responses never return that credential.
servers:
  - url: /api/karst/v1
security:
  - bearerAuth: []
paths:
  /versions:
    get:
      operationId: softwareVersions
      description: Admin/owner-only software identity. Deployment components are a timestamped operator snapshot, not a live health query.
      responses:
        '200':
          description: Running control binary and optional deployment snapshot
          content:
            application/json:
              schema:
                type: object
                required: [control, deployment_status]
                properties:
                  control:
                    type: object
                    required: [version, revision]
                    properties:
                      version: {type: string}
                      revision: {type: string}
                  deployment_status: {type: string, enum: [available, not_configured, unavailable]}
                  deployment:
                    type: object
                    required: [observed_at, components]
                    properties:
                      observed_at: {type: string, format: date-time}
                      components:
                        type: array
                        items:
                          type: object
                          required: [name, image, image_id, tags, state]
                          properties:
                            name: {type: string}
                            image: {type: string}
                            image_id: {type: string}
                            tags: {type: array, items: {type: string}}
                            state: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /domains:
    get:
      operationId: listMeshDomains
      tags: [domains]
      description: |
        Returns only domains visible through account-wide or delegated domain
        read authority. dns_name includes the account root suffix even when the
        root itself lies outside the visible subtree; it grants no wider authority.
      responses:
        '200':
          description: Visible domain tree
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/MeshDomainView'}}
        default: {$ref: '#/components/responses/Error'}
  /domains/{id}:
    get:
      operationId: getMeshDomain
      tags: [domains]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Authorized domain and complete DNS namespace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeshDomainView'}
        default: {$ref: '#/components/responses/Error'}
  /domains/root/rename/preview:
    post:
      operationId: previewRootRename
      tags: [domains]
      description: |
        Requires account-wide domain-update authority. Validates and canonicalizes
        the suffix, reports affected names, and returns an opaque revision bound
        to the reviewed naming state. Delegated domain administration is insufficient.
        No writes or old-suffix aliases are created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dns_suffix]
              properties:
                dns_suffix: {type: string, maxLength: 254}
      responses:
        '200':
          description: Validated naming preview; Cache-Control is no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RootRenamePreview'}
        default: {$ref: '#/components/responses/Error'}
  /domains/root/rename/commit:
    post:
      operationId: commitRootRename
      tags: [domains]
      description: |
        Revalidates account-wide authority, suffix constraints and preview revision
        under the account lock. Atomically changes the root suffix and account DNS
        projections and advances naming/network revisions. Stale previews return
        412; invalid suffixes or absent confirmation return 422. Identity, relative
        names, memberships and policy references remain unchanged. There are no
        old-suffix aliases. Delivery is asynchronous and client convergence is
        unobserved. Rollback requires a new preview and confirmation of the old suffix.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dns_suffix, revision, confirm_no_aliases]
              properties:
                dns_suffix: {type: string, maxLength: 254}
                revision: {type: string}
                confirm_no_aliases: {type: boolean, enum: [true]}
      responses:
        '200':
          description: Committed naming configuration; Cache-Control is no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RootRenamePreview'}
        default: {$ref: '#/components/responses/Error'}
  /usage/devices:
    get:
      operationId: getDeviceUsage
      tags: [usage]
      description: |
        Account-owner/admin report of recorded enrolled-device usage. Account
        scope comes from authenticated authorization. Every read is audited.
        Request a past, nonempty interval of at most 93 days, with microsecond
        timestamp precision. Dense windows must be narrowed; results are never
        silently truncated. This reports usage, not prices or invoices.
      parameters:
        - {name: start, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: end, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Consistent ledger and collection-coverage snapshot
          headers:
            Cache-Control: {schema: {type: string}, description: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceUsageReport'}
        default: {$ref: '#/components/responses/Error'}
  /usage/relays:
    get:
      operationId: getRelayUsage
      tags: [usage]
      description: |
        Account-owner/admin report of received relay usage batches. Account
        scope comes from authenticated authorization; every read is audited.
        Request a past, nonempty interval of at most 93 days aligned to whole
        minutes. This is not an invoice. Completeness compares received windows
        with retained authorization periods for explicitly enrolled managed
        producers; periods before the history cutover remain unknown.
      parameters:
        - {name: start, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: end, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Received relay usage snapshot with explicit coverage limitations
          headers:
            Cache-Control: {schema: {type: string}, description: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RelayUsageReport'}
        default: {$ref: '#/components/responses/Error'}
  /usage/relay-alerts:
    get:
      operationId: getRelayBillingAlerts
      tags: [usage]
      description: |
        Account-owner/admin in-app relay usage alert feed. The current period is
        reevaluated when read; newly crossed 75%, 90%, and 100% thresholds are
        persisted once per period. Account scope comes from authenticated
        authorization and every read is audited. An incomplete report includes
        a coverage warning, and its reported amounts are lower bounds.
      parameters:
        - {name: period, in: query, required: true, schema: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}}
      responses:
        '200':
          description: Account-scoped alert feed with usage coverage status
          headers:
            Cache-Control: {schema: {type: string}, description: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RelayAlertFeed'}
        default: {$ref: '#/components/responses/Error'}
  /billing/relay-cap:
    get:
      operationId: getRelaySpendingCap
      tags: [billing]
      description: Account-owner/admin view of the optional organization-wide managed relay cap for one UTC calendar month. Every read is audited. An unset cap is returned as enabled=false.
      parameters:
        - {name: period, in: query, required: true, schema: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}}
      responses:
        '200': {description: Current cap setting, content: {application/json: {schema: {$ref: '#/components/schemas/RelayCap'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setRelaySpendingCap
      tags: [billing]
      description: Set the monthly USD managed-relay overage limit. Requires acknowledging that capped relay forwarding can pause at the limit. Only current and future assigned months are accepted. Decreases require all issued relay grants to be surrendered and consumed usage to fit below the new limit. Relays surrender unused credits during clean shutdown; credits from an uncleanly stopped or unreachable relay remain reserved for the period. Increases remain available.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelayCapDraft'}}}}
      responses:
        '200': {description: Saved cap setting, content: {application/json: {schema: {$ref: '#/components/schemas/RelayCap'}}}}
        default: {$ref: '#/components/responses/Error'}
  /billing/relay-credits:
    post:
      operationId: requestRelayCredits
      tags: [billing]
      security: []
      description: Relay-only signed ML-DSA request. The control plane resolves account ownership from the currently enabled producer and exact allowed mapping; relay-supplied account identifiers are never trusted. When no cap is configured, returns a short uncapped lease. This endpoint is independent of packet forwarding.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelayCreditRequest'}}}}
      responses:
        '200': {description: Account-wide reservation, content: {application/json: {schema: {$ref: '#/components/schemas/RelayCreditGrant'}}}}
        '204': {description: Short uncapped lease, headers: {X-Karst-Relay-Cap-Mode: {schema: {type: string, enum: [uncapped]}}, X-Karst-Relay-Cap-Lease-Millis: {schema: {type: integer, minimum: 1}}}}
        '425': {description: Cap activation is waiting for existing uncapped leases}
        '429': {description: Account-wide relay byte budget is exhausted}
        default: {$ref: '#/components/responses/Error'}
  /billing/relay-credits/{grant_id}/surrender:
    parameters:
      - {name: grant_id, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{32}$'}}
    post:
      operationId: surrenderRelayCredits
      tags: [billing]
      security: []
      description: Relay-only signed final report after the local forwarding gate has stopped spending this grant. Consumed bytes include every payload reserved before queueing a destination write, including ambiguous writes. Identical retries are idempotent; a different consumed count conflicts. A crashed relay does not surrender grants, so their full reservation remains until period end.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelayCreditSurrender'}}}}
      responses:
        '204': {description: Grant surrendered; only unused bytes are released}
        '404': {description: Grant is unknown or does not belong to this relay generation}
        '409': {description: Surrender conflicts with the previously accepted final report}
  /billing/payments:
    get:
      operationId: getBillingPayment
      tags: [billing]
      description: Account-owner/admin view of one finalized invoice and its asynchronous Paddle payment state. Account scope always comes from authenticated authorization; the read is audited.
      parameters:
        - {name: period, in: query, required: true, schema: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}, description: UTC calendar month in YYYY-MM form.}
      responses:
        '200': {description: Finalized invoice totals and current payment state, headers: {Cache-Control: {schema: {type: string}, description: no-store}}, content: {application/json: {schema: {$ref: '#/components/schemas/BillingPayment'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: queueBillingPayment
      tags: [billing]
      description: Account-owner/admin explicitly requests collection for a finalized invoice. The request is durably queued and audited; Paddle calls happen asynchronously. Repeating a request for the same invoice does not create a second payment intent.
      parameters:
        - {name: period, in: query, required: true, schema: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}, description: UTC calendar month in YYYY-MM form.}
      responses:
        '202': {description: Collection request accepted into the durable payment outbox, headers: {Cache-Control: {schema: {type: string}, description: no-store}}, content: {application/json: {schema: {$ref: '#/components/schemas/BillingPayment'}}}}
        default: {$ref: '#/components/responses/Error'}
  /billing/payment-notices:
    get:
      operationId: getBillingPaymentNotices
      tags: [billing]
      description: Account-owner/admin view of persisted payment-failure notices for one invoice period. Notices come from durable payment-state history, are retained with payment audit state, and the read is audited. Account scope always comes from authenticated authorization.
      parameters:
        - {name: period, in: query, required: true, schema: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}, description: UTC calendar month in YYYY-MM form.}
      responses:
        '200':
          description: Account-scoped persisted payment-failure notices
          headers: {Cache-Control: {schema: {type: string}, description: no-store}}
          content: {application/json: {schema: {$ref: '#/components/schemas/BillingPaymentNoticeFeed'}}}
        default: {$ref: '#/components/responses/Error'}
  /invitations:
    get:
      operationId: listDeviceInvitations
      tags: [enrollment]
      responses:
        '200': {description: Account-scoped invitation lifecycle, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DeviceInvitation'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createDeviceInvitation
      tags: [enrollment]
      description: Authorize one device for 24 hours without requiring a recipient account. The credential is returned only on creation. Access groups are immutable.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceInvitationDraft'}}}}
      responses:
        '200': {description: New invitation with its one-time-displayed credential, headers: {Cache-Control: {schema: {type: string}, description: no-store}}, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceInvitation'}}}}
        default: {$ref: '#/components/responses/Error'}
  /invitations/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: revokeDeviceInvitation
      tags: [enrollment]
      description: Revoke unused enrollment authorization. Already registered devices are managed separately.
      responses:
        '200': {description: Updated invitation state, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceInvitation'}}}}
        default: {$ref: '#/components/responses/Error'}
  /nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      parameters:
        - $ref: '#/components/parameters/tag'
        - $ref: '#/components/parameters/user'
        - $ref: '#/components/parameters/posture'
        - $ref: '#/components/parameters/coverage'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200': {description: Node page, content: {application/json: {schema: {$ref: '#/components/schemas/NodePage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /nodes/{handle}:
    parameters: [{$ref: '#/components/parameters/handle'}]
    get:
      operationId: getNode
      tags: [nodes]
      responses:
        '200': {description: Node, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateNode
      tags: [nodes]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NodeUpdate'}}}}
      responses:
        '200': {description: Updated node, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deprovisionNode
      tags: [nodes]
      responses:
        '204': {description: Node deprovisioned}
        default: {$ref: '#/components/responses/Error'}
  /nodes/{handle}/paths:
    parameters: [{$ref: '#/components/parameters/handle'}]
    get:
      operationId: getNodePaths
      tags: [nodes]
      responses:
        '200': {description: Last paths reported by this node, content: {application/json: {schema: {$ref: '#/components/schemas/NodePaths'}}}}
        default: {$ref: '#/components/responses/Error'}
  /nodes/{handle}/posture:
    parameters: [{$ref: '#/components/parameters/handle'}]
    get:
      operationId: getNodePosture
      tags: [nodes]
      responses:
        '200': {description: Last cryptographic posture reported by this node, content: {application/json: {schema: {$ref: '#/components/schemas/NodePosture'}}}}
        default: {$ref: '#/components/responses/Error'}
  /me/devices:
    get:
      operationId: listMyDevices
      tags: [portal]
      responses:
        '200': {description: Devices owned by the authenticated subject, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MyDevice'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /me/enrollment:
    get:
      operationId: getMyEnrollmentSettings
      tags: [portal]
      responses:
        '200': {description: Public control pins delivered through the authenticated HTTPS origin, content: {application/json: {schema: {$ref: '#/components/schemas/EnrollmentSettings'}}}}
        default: {$ref: '#/components/responses/Error'}
  /me/devices/enroll:
    post:
      operationId: enrollMyDevice
      tags: [portal]
      responses:
        '200': {description: Short-lived single-use device key, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceEnrollment'}}}}
        default: {$ref: '#/components/responses/Error'}
  /me/devices/{handle}:
    parameters: [{$ref: '#/components/parameters/handle'}]
    patch:
      operationId: renameMyDevice
      tags: [portal]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceRename'}}}}
      responses:
        '200': {description: Renamed owned device, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: revokeMyDevice
      tags: [portal]
      responses:
        '204': {description: Device revoked and its session dropped}
        default: {$ref: '#/components/responses/Error'}
  /me/access:
    get:
      operationId: getMyAccess
      tags: [portal]
      responses:
        '200': {description: Reachable destinations with compiled-policy provenance, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AccessExplanation'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /me/sessions:
    get:
      operationId: listMySessions
      tags: [portal]
      responses:
        '200': {description: Session audit history for the authenticated subject, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MySession'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /policy:
    get:
      operationId: getPolicy
      tags: [policy]
      responses:
        '200': {description: Current policy, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyVersion'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: writePolicy
      tags: [policy]
      parameters: [{$ref: '#/components/parameters/ifMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyWrite'}}}}
      responses:
        '200': {description: Newly written version, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyVersion'}}}}
        '412': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/Error'}
  /policy/versions:
    get:
      operationId: listPolicyVersions
      tags: [policy]
      parameters: [{$ref: '#/components/parameters/cursor'}, {$ref: '#/components/parameters/limit'}]
      responses:
        '200': {description: Version page, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyVersionPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /policy/versions/{version}:
    parameters: [{$ref: '#/components/parameters/version'}]
    get:
      operationId: getPolicyVersion
      tags: [policy]
      responses:
        '200': {description: Policy version, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyVersion'}}}}
        default: {$ref: '#/components/responses/Error'}
  /policy/schema:
    get:
      operationId: getPolicySchema
      tags: [policy]
      responses:
        # No response schema: the body is a JSON Schema (2020-12) document
        # for editor autocomplete/lint, a different vocabulary from every
        # other schema here, and pinning its own shape into this spec would
        # buy nothing a JSON Schema meta-schema does not already say better.
        '200': {description: 'JSON Schema (2020-12) for a policy document, for editor autocomplete/lint', content: {application/json: {}}}
        default: {$ref: '#/components/responses/Error'}
  /policy/validate:
    post:
      operationId: validatePolicy
      tags: [policy]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyWrite'}}}}
      responses:
        '200': {description: Validation diagnostics, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyValidation'}}}}
        default: {$ref: '#/components/responses/Error'}
  /policy/preview:
    post:
      operationId: previewPolicy
      tags: [policy]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyWrite'}}}}
      responses:
        '200': {description: Flow-level change preview, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyPreview'}}}}
        default: {$ref: '#/components/responses/Error'}
  /policy/rollback/{version}:
    parameters: [{$ref: '#/components/parameters/version'}]
    post:
      operationId: rollbackPolicy
      tags: [policy]
      parameters: [{$ref: '#/components/parameters/ifMatch'}]
      responses:
        '200': {description: New version copied from the requested version, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyVersion'}}}}
        '412': {$ref: '#/components/responses/VersionConflict'}
        default: {$ref: '#/components/responses/Error'}
  /policy/test:
    post:
      operationId: testPolicy
      tags: [policy]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyWrite'}}}}
      responses:
        '200': {description: Policy test results, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyTestResult'}}}}
        default: {$ref: '#/components/responses/Error'}
  /relay-services:
    get:
      operationId: listRelayServices
      tags: [relays]
      description: Explicit account-scoped Ponor/TURN associations. Presence means registry availability, not runtime health.
      responses:
        '200': {description: Relay services, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RelayServiceView'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createRelayService
      tags: [relays]
      description: Associate existing account-local registry records. Service publication mode updates client endpoints; credentials and backend processes remain separate.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelayService'}}}}
      responses:
        '201': {description: Association created, content: {application/json: {schema: {$ref: '#/components/schemas/RelayService'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /relay-services/publication:
    get:
      operationId: getRelayPublication
      tags: [relays]
      responses:
        '200': {description: Active publication authority, content: {application/json: {schema: {$ref: '#/components/schemas/RelayPublication'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setRelayPublication
      tags: [relays]
      description: Explicitly select legacy registries or validated service publication and notify connected clients. Empty service publication withdraws all Relay endpoints without falling back to legacy registries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode, acknowledge_connectivity_change]
              properties:
                mode: {type: string, enum: [legacy, services]}
                acknowledge_connectivity_change: {type: boolean, enum: [true]}
      responses:
        '200': {description: Publication authority changed, content: {application/json: {schema: {$ref: '#/components/schemas/RelayPublication'}}}}
        default: {$ref: '#/components/responses/Error'}
  /relay-services/publication/preview:
    post:
      operationId: previewRelayPublication
      tags: [relays]
      description: Validate the service projection and return its explicit backend associations without changing publication or minting credentials. Unsupported multi-TURN topology and missing credential configuration are rejected.
      responses:
        '200': {description: Validated service projection, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RelayService'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /relay-services/{serviceId}:
    parameters:
      - {name: serviceId, in: path, required: true, schema: {type: string}}
    delete:
      operationId: deleteRelayService
      tags: [relays]
      description: Remove the association. Service publication mode withdraws endpoints no other service uses; registry records and external processes remain independently managed.
      responses:
        '204': {description: Association removed}
        default: {$ref: '#/components/responses/Error'}
  /relays:
    get:
      operationId: listRelays
      tags: [relays]
      responses:
        '200': {description: Relay registry, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Relay'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createRelay
      tags: [relays]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelayCreate'}}}}
      responses:
        '201': {description: Onboarded relay, content: {application/json: {schema: {$ref: '#/components/schemas/Relay'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /relays/{relayId}:
    parameters: [{$ref: '#/components/parameters/relayId'}]
    delete:
      operationId: deleteRelay
      tags: [relays]
      responses:
        '204': {description: Relay removed}
        default: {$ref: '#/components/responses/Error'}
  /relays/{relayId}/health:
    parameters: [{$ref: '#/components/parameters/relayId'}]
    get:
      operationId: getRelayHealth
      tags: [relays]
      responses:
        '200': {description: Relay health derived from the roster, content: {application/json: {schema: {$ref: '#/components/schemas/RelayHealth'}}}}
        default: {$ref: '#/components/responses/Error'}
  /noc/components:
    get:
      operationId: nocComponents
      tags: [noc]
      description: >-
        The NOC view's map data source (#241 Phase 1a, ADR-0046/ADR-0047,
        extended to ADR-0046 §1's full component list) -- every relay, TURN
        server, exit-node/subnet-router gateway group, and the account's
        control-plane/Bedrock declared locations this account can see,
        reshaped into one discriminated union. Every call is audit-logged
        (karst.noc.view) explicitly, since this is a GET.
      responses:
        '200': {description: Every NOC component this account can see, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/NocComponent'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /locations:
    get:
      operationId: listLocations
      tags: [noc]
      responses:
        '200': {description: Admin-authorized locations registry, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Location'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createLocation
      tags: [noc]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LocationCreate'}}}}
      responses:
        '201': {description: Authorized location, content: {application/json: {schema: {$ref: '#/components/schemas/Location'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /locations/{locationId}:
    parameters: [{name: locationId, in: path, required: true, schema: {type: string}}]
    delete:
      operationId: deleteLocation
      tags: [noc]
      responses:
        '204': {description: Location removed}
        default: {$ref: '#/components/responses/Error'}
  /group-locations:
    get:
      operationId: listGroupLocations
      tags: [noc]
      responses:
        '200': {description: Every gateway group with a declared location, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/GroupLocation'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /group-locations/{groupId}:
    parameters: [{name: groupId, in: path, required: true, schema: {type: string}}]
    put:
      operationId: setGroupLocation
      tags: [noc]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LocationCreate'}}}}
      responses:
        '200': {description: Declared group location, content: {application/json: {schema: {$ref: '#/components/schemas/GroupLocation'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteGroupLocation
      tags: [noc]
      responses:
        '204': {description: Group location removed}
        default: {$ref: '#/components/responses/Error'}
  /control-plane/location:
    get:
      operationId: getControlPlaneLocation
      tags: [noc]
      responses:
        '200': {description: Declared control-plane location, content: {application/json: {schema: {$ref: '#/components/schemas/RelayLocation'}}}}
        '204': {description: No location declared yet}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setControlPlaneLocation
      tags: [noc]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelayLocation'}}}}
      responses:
        '200': {description: Declared control-plane location, content: {application/json: {schema: {$ref: '#/components/schemas/RelayLocation'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /bedrock/location:
    put:
      operationId: setBedrockLocation
      tags: [noc, bedrock]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelayLocation'}}}}
      responses:
        '200': {description: Declared Bedrock location, content: {application/json: {schema: {$ref: '#/components/schemas/RelayLocation'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /noc/relays/{relayId}:
    parameters: [{$ref: '#/components/parameters/relayId'}]
    get:
      operationId: nocRelay
      tags: [noc]
      description: The NOC map's marker-click drill-down for one relay. Audit-logged as karst.noc.drilldown.
      responses:
        '200': {description: One relay, content: {application/json: {schema: {$ref: '#/components/schemas/Relay'}}}}
        default: {$ref: '#/components/responses/Error'}
  /demand/regions:
    get:
      operationId: demandRegions
      tags: [demand]
      description: >-
        ADR-0045 §7 Phase 1's per-(region, aquifer) demand feed -- §4a's RTT
        histogram, aggregated across every account's relays. Deliberately
        cross-account, unlike every other endpoint in this file; requires
        the advisor role (see the Advisor permission role), not merely
        read access to karst control. Audit-logged as karst.demand.regions.view.
      responses:
        '200': {description: 'Per-(region, account) RTT histogram', content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RegionDemand'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /demand/anchors:
    get:
      operationId: demandAnchors
      tags: [demand]
      description: >-
        ADR-0045 §7 Phase 1's second demand-side input -- §4b's deployment-wide,
        anonymous anchor-RTT histogram. No node or account identity appears in
        this response. Requires the advisor role, the same as demandRegions,
        so that "who can see what the Advisor sees" stays one grant. Audit-logged
        as karst.demand.anchors.view.
      responses:
        '200': {description: Deployment-wide anchor-RTT histogram, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AnchorHistogramEntry'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /scaler/recommendations:
    get:
      operationId: scalerRecommendations
      tags: [scaler]
      description: >-
        ADR-0045 §7 Phase 1's "recommended vs actual" view, proxied unchanged
        from karst-scaler advise's own loopback /recommendations endpoint
        (KARST_SCALER_ADVISOR_URL) -- the browser never dials karst-scaler
        directly. Requires the advisor role, the same as demandRegions/
        demandAnchors. Precondition-failed (not 404) if
        KARST_SCALER_ADVISOR_URL is not configured for this deployment.
      responses:
        '200': {description: The Advisor's latest completed tick, content: {application/json: {schema: {$ref: '#/components/schemas/ScalerRecommendations'}}}}
        default: {$ref: '#/components/responses/Error'}
  /scaler/suggestions:
    get:
      operationId: scalerSuggestions
      tags: [scaler]
      description: >-
        Issue #381's manual-mode-shaped "suggested by RTT" view, proxied
        unchanged from karst-scaler advise's own loopback /suggestions
        endpoint (KARST_SCALER_ADVISOR_URL) -- the browser never dials
        karst-scaler directly. Requires the advisor role, the same as
        scalerRecommendations. Precondition-failed (not 404) if
        KARST_SCALER_ADVISOR_URL is not configured for this deployment.
      responses:
        '200': {description: The Advisor's latest latency-breach and region-candidate signals, content: {application/json: {schema: {$ref: '#/components/schemas/ScalerSuggestions'}}}}
        default: {$ref: '#/components/responses/Error'}
  /scaling/mode:
    get:
      operationId: getScalingMode
      tags: [scaler]
      description: >-
        ADR-0045 §7's Phase 1 (manual, compute and report)/Phase 2
        (automated, compute and reconcile) actuation switch (issues #356,
        #379, #380) -- a deployment-wide setting, not per-pool. No
        elevated role beyond karstAuthorization's own module-Read gate:
        both the console's NOC view and karst-scaler's own tick need this
        with no special-cased access.
      responses:
        '200': {description: Current scaling mode, content: {application/json: {schema: {$ref: '#/components/schemas/ScalingMode'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setScalingMode
      tags: [scaler]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScalingMode'}}}}
      responses:
        '200': {description: Current scaling mode, content: {application/json: {schema: {$ref: '#/components/schemas/ScalingMode'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /regions:
    get:
      operationId: listAllowedRegions
      tags: [scaler]
      description: >-
        ADR-0045 §4c's deployment-wide region allowlist (package
        regionallow). Governs what is projected into every node's netmap
        as KarstAllowedRegions and fail-closed validation of incoming §4b
        anchor-RTT demand reports -- a different list from the one
        karst-scaler's own driver reads to decide where it may actually
        provision capacity, kept intentionally out of the control plane's
        trust domain (ADR-0045 §6).
      responses:
        '200': {description: The current allowlist, flattened and sorted, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AllowedRegion'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAllowedRegion
      tags: [scaler]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AllowedRegion'}}}}
      responses:
        '201': {description: Allowed region, content: {application/json: {schema: {$ref: '#/components/schemas/AllowedRegion'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /regions/{provider}/{region}:
    parameters:
      - {name: provider, in: path, required: true, schema: {type: string}}
      - {name: region, in: path, required: true, schema: {type: string}}
    delete:
      operationId: deleteAllowedRegion
      tags: [scaler]
      responses:
        '204': {description: Region revoked}
        default: {$ref: '#/components/responses/Error'}
  /firstrun:
    get:
      operationId: getFirstRunState
      tags: [firstrun]
      description: >-
        Whether this account has completed the console's first-run setup
        wizard (default domain + initial groups). A missing record (a
        brand-new account) reports completed=false; every account that
        existed before this feature shipped was backfilled completed=true,
        so it is never interrupted by a wizard it never asked for.
      responses:
        '200': {description: First-run completion state, content: {application/json: {schema: {$ref: '#/components/schemas/FirstRunState'}}}}
        default: {$ref: '#/components/responses/Error'}
  /firstrun/complete:
    post:
      operationId: completeFirstRun
      tags: [firstrun]
      description: Marks first-run setup done. Idempotent.
      responses:
        '200': {description: First-run completion state, content: {application/json: {schema: {$ref: '#/components/schemas/FirstRunState'}}}}
        default: {$ref: '#/components/responses/Error'}
  /tutorial-mode:
    get:
      operationId: getTutorialMode
      tags: [settings]
      description: Whether per-page "what is this" guidance text is shown. Defaults to true.
      responses:
        '200': {description: Tutorial mode setting, content: {application/json: {schema: {$ref: '#/components/schemas/TutorialMode'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setTutorialMode
      tags: [settings]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TutorialMode'}}}}
      responses:
        '200': {description: Tutorial mode setting, content: {application/json: {schema: {$ref: '#/components/schemas/TutorialMode'}}}}
        default: {$ref: '#/components/responses/Error'}
  /cloud-accounts:
    get:
      operationId: listCloudAccounts
      tags: [settings]
      description: >-
        Admin-entered AWS/Azure/GCP credentials (ADR-0045 §6 addendum).
        Secrets are never included in the response -- see CloudAccount.
      responses:
        '200': {description: Configured cloud credentials, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CloudAccount'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createCloudAccount
      tags: [settings]
      description: >-
        Requires the admin or owner role. Refused with a precondition
        failure if this deployment has no data-store encryption key
        configured -- a credential is never stored unencrypted.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CloudAccountCreate'}}}}
      responses:
        '201': {description: Stored credential (secret omitted), content: {application/json: {schema: {$ref: '#/components/schemas/CloudAccount'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /cloud-accounts/{cloudAccountId}:
    parameters: [{name: cloudAccountId, in: path, required: true, schema: {type: string}}]
    delete:
      operationId: deleteCloudAccount
      tags: [settings]
      description: Requires the admin or owner role.
      responses:
        '204': {description: Credential removed}
        default: {$ref: '#/components/responses/Error'}
  /cloud-accounts/{cloudAccountId}/regions:
    parameters: [{name: cloudAccountId, in: path, required: true, schema: {type: string}}]
    get:
      operationId: listCloudAccountRegions
      tags: [settings]
      description: >-
        Calls out to the credential's own provider and lists the regions
        and (for AWS) local zones available to that account, enriched with
        approximate coordinates from a static catalog where available -- see
        the Authorized Locations picker. A read_write credential also sees
        a Local Zone group that exists but is not yet opted in (enabled:
        false); a read_only credential only ever sees opted-in ones.
      responses:
        '200': {description: Discovered regions/zones, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DiscoveredRegion'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /cloud-accounts/{cloudAccountId}/regions/{code}/enable:
    parameters: [{name: cloudAccountId, in: path, required: true, schema: {type: string}}, {name: code, in: path, required: true, schema: {type: string}, description: A DiscoveredRegion's code, e.g. a Local Zone group name such as us-east-1-bos-1.}]
    post:
      operationId: enableCloudAccountRegion
      tags: [settings]
      description: >-
        Opts an AWS Local Zone's group into use (ModifyAvailabilityZoneGroup)
        -- ADR-0045 §6's second addendum. Requires the admin or owner role
        and a read_write credential. This is a one-way door on AWS's side:
        there is no API to opt back out. Does not create, modify, or
        destroy a billable resource by itself.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [parent_region], properties: {parent_region: {type: string, description: "The DiscoveredRegion's own parent_region -- which regional EC2 endpoint to call against."}}}}}}
      responses:
        '200': {description: The now-enabled region, content: {application/json: {schema: {$ref: '#/components/schemas/DiscoveredRegion'}}}}
        default: {$ref: '#/components/responses/Error'}
  /turns:
    get:
      operationId: listTurnServers
      tags: [turns]
      responses:
        '200': {description: TURN server registry, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TurnServer'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createTurnServer
      tags: [turns]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TurnServerCreate'}}}}
      responses:
        '201': {description: Onboarded TURN server, content: {application/json: {schema: {$ref: '#/components/schemas/TurnServer'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /turns/{turnId}:
    parameters: [{$ref: '#/components/parameters/turnId'}]
    delete:
      operationId: deleteTurnServer
      tags: [turns]
      responses:
        '204': {description: TURN server removed}
        default: {$ref: '#/components/responses/Error'}
  /bedrock:
    get:
      operationId: getBedrock
      tags: [bedrock]
      responses:
        '200': {description: Bedrock configuration, content: {application/json: {schema: {$ref: '#/components/schemas/BedrockStatus'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bedrock/log:
    get:
      operationId: listBedrockLog
      tags: [bedrock]
      parameters: [{$ref: '#/components/parameters/cursor'}, {$ref: '#/components/parameters/limit'}]
      responses:
        '200': {description: Bedrock log page, content: {application/json: {schema: {$ref: '#/components/schemas/BedrockLogPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bedrock/log/verify:
    get:
      operationId: verifyBedrockLog
      tags: [bedrock]
      responses:
        '200': {description: Chain verification, content: {application/json: {schema: {$ref: '#/components/schemas/ChainVerification'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bedrock/requests:
    get:
      operationId: listBedrockRequests
      tags: [bedrock]
      responses:
        '200': {description: Pending signing requests, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SigningRequest'}}}}}
        default: {$ref: '#/components/responses/Error'}
  /bedrock/requests/export:
    post:
      operationId: exportBedrockRequests
      tags: [bedrock]
      responses:
        '200': {description: Offline signer bundle, content: {application/json: {schema: {$ref: '#/components/schemas/SignedBundle'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bedrock/audit-anchor/export:
    post:
      operationId: exportBedrockAuditAnchor
      tags: [bedrock, audit]
      responses:
        '200': {description: Offline signing request for the current audit head, content: {application/json: {schema: {$ref: '#/components/schemas/SignedBundle'}}}}
        default: {$ref: '#/components/responses/Error'}
  /bedrock/responses/import:
    post:
      operationId: importBedrockResponses
      tags: [bedrock]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SignedBundle'}}}}
      responses:
        '204': {description: Signed responses imported}
        default: {$ref: '#/components/responses/Error'}
  /bedrock/bootstrap/import:
    post:
      operationId: importBedrockBootstrap
      tags: [bedrock]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BedrockBootstrapBundle'}}}}
      responses:
        '204': {description: Root-signed genesis imported}
        default: {$ref: '#/components/responses/Error'}
  /bedrock/mode:
    put:
      operationId: setBedrockMode
      tags: [bedrock]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BedrockModeWrite'}}}}
      responses:
        '200': {description: Updated status, content: {application/json: {schema: {$ref: '#/components/schemas/BedrockStatus'}}}}
        '409': {$ref: '#/components/responses/AcknowledgmentMismatch'}
        default: {$ref: '#/components/responses/Error'}
  /posture:
    get:
      operationId: getPosture
      tags: [posture]
      parameters: [{$ref: '#/components/parameters/observedSince'}]
      responses:
        '200': {description: Defensible aggregate posture, content: {application/json: {schema: {$ref: '#/components/schemas/PostureAggregate'}}}}
        default: {$ref: '#/components/responses/Error'}
  /posture/sessions:
    get:
      operationId: listPostureSessions
      tags: [posture]
      parameters: [{$ref: '#/components/parameters/posture'}, {$ref: '#/components/parameters/cursor'}, {$ref: '#/components/parameters/limit'}]
      responses:
        '200': {description: Session posture page, content: {application/json: {schema: {$ref: '#/components/schemas/SessionPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /audit:
    get:
      operationId: listAuditEntries
      tags: [audit]
      parameters: [{$ref: '#/components/parameters/cursor'}, {$ref: '#/components/parameters/limit'}, {$ref: '#/components/parameters/actor'}, {$ref: '#/components/parameters/action'}]
      responses:
        '200': {description: Audit page, content: {application/json: {schema: {$ref: '#/components/schemas/AuditPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /audit/export:
    get:
      operationId: exportAudit
      tags: [audit]
      parameters: [{$ref: '#/components/parameters/exportFormat'}]
      responses:
        '200': {description: Audit export, content: {application/json: {schema: {oneOf: [{type: array, items: {$ref: '#/components/schemas/AuditEntry'}}, {type: string, format: binary}]}, text/csv: {schema: {type: string, format: binary}}}}}
        default: {$ref: '#/components/responses/Error'}
  /audit/head:
    get:
      operationId: getAuditHead
      tags: [audit]
      responses:
        '200': {description: Current anchor candidate, content: {application/json: {schema: {$ref: '#/components/schemas/AuditHead'}}}}
        default: {$ref: '#/components/responses/Error'}
  /audit/verify:
    get:
      operationId: verifyAudit
      tags: [audit]
      responses:
        '200': {description: Audit chain verification, content: {application/json: {schema: {$ref: '#/components/schemas/ChainVerification'}}}}
        default: {$ref: '#/components/responses/Error'}
  /audit/sinks:
    get:
      operationId: listAuditSinks
      tags: [audit]
      responses:
        '200': {description: Configured audit sinks, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AuditSink'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAuditSink
      tags: [audit]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuditSinkWrite'}}}}
      responses:
        '201': {description: Audit sink configured, content: {application/json: {schema: {$ref: '#/components/schemas/AuditSink'}}}}
        default: {$ref: '#/components/responses/Error'}
  /audit/sinks/{sinkId}:
    parameters: [{$ref: '#/components/parameters/sinkId'}]
    delete:
      operationId: deleteAuditSink
      tags: [audit]
      responses:
        '204': {description: Audit sink removed}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    handle: {name: handle, in: path, required: true, schema: {type: string, minLength: 44, maxLength: 44}}
    relayId: {name: relayId, in: path, required: true, schema: {type: string, readOnly: true}}
    turnId: {name: turnId, in: path, required: true, schema: {type: string, readOnly: true}}
    sinkId: {name: sinkId, in: path, required: true, schema: {type: string, readOnly: true}}
    version: {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    cursor: {name: cursor, in: query, schema: {type: string}}
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    tag: {name: tag, in: query, schema: {type: string}}
    user: {name: user, in: query, schema: {type: string}}
    posture: {name: posture, in: query, schema: {type: string, enum: [pq, lattice_only, stale, unknown]}}
    coverage: {name: coverage, in: query, schema: {type: string, enum: [covered, uncovered, stale]}}
    actor: {name: actor, in: query, schema: {type: string}}
    action: {name: action, in: query, schema: {type: string}}
    observedSince: {name: observed_since, in: query, schema: {type: string, format: date-time}}
    ifMatch: {name: If-Match, in: header, required: true, schema: {type: string}, description: Current policy version ETag.}
    exportFormat: {name: format, in: query, required: true, schema: {type: string, enum: [json, csv]}}
  responses:
    Error: {description: Error response, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    VersionConflict: {description: The supplied policy version is no longer current, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    AcknowledgmentMismatch: {description: Enforcing acknowledgment does not equal the server-computed cut-off set, content: {application/json: {schema: {$ref: '#/components/schemas/AcknowledgmentMismatch'}}}}
  schemas:
    MeshDomainView:
      type: object
      required: [id, label, path, is_root, naming_revision]
      properties:
        id: {type: string, description: 'Stable domain identity.'}
        parent_id: {type: string}
        label: {type: string}
        path: {type: string, description: 'Immutable root-relative path; empty for the root.'}
        is_root: {type: boolean}
        dns_suffix: {type: string, description: 'Authoritative account suffix, present only on the root.'}
        dns_name: {type: string, description: 'Complete domain namespace, including the root suffix; available to authorized delegated views without listing the root.'}
        naming_revision: {type: integer, format: uint64, minimum: 0}
    RootRenamePreview:
      type: object
      required: [root_id, old_suffix, new_suffix, revision, naming_revision, device_count, domain_count, examples, committed, convergence]
      properties:
        root_id: {type: string}
        old_suffix: {type: string}
        new_suffix: {type: string}
        revision: {type: string, description: 'Opaque preview token; return unchanged at commit.'}
        naming_revision: {type: integer, format: uint64, minimum: 0}
        device_count: {type: integer, minimum: 0}
        domain_count: {type: integer, minimum: 0}
        committed: {type: boolean}
        convergence: {type: string, enum: [unobserved], description: 'No client application acknowledgement exists in the current protocol.'}
        examples:
          type: array
          maxItems: 10
          items:
            type: object
            required: [before, after]
            properties:
              before: {type: string}
              after: {type: string}
    DeviceUsageReport:
      type: object
      additionalProperties: false
      required: [start, end, as_of, complete, device_microseconds, segments]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        as_of: {type: string, format: date-time}
        complete: {type: boolean, description: True only if the entire requested window has complete collection coverage.}
        device_microseconds:
          type: string
          pattern: '^[0-9]+$'
          description: Exact eligible device-time summed only over complete intervals. Zero with incomplete coverage does not prove zero usage.
        segments: {type: array, maxItems: 10000, items: {$ref: '#/components/schemas/DeviceUsageSegment'}}
    DeviceUsageSegment:
      type: object
      additionalProperties: false
      required: [start, end, coverage, devices]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        coverage: {type: string, enum: [complete, incomplete, uncollected]}
        devices: {type: integer, format: int64, minimum: 0, nullable: true, description: Eligible enrolled devices in this half-open interval; null outside complete coverage.}
    RelayUsageReport:
      type: object
      additionalProperties: false
      required: [start, end, as_of, authorization_history_start, coverage, history_complete, complete, expected_windows, missing_windows, unexpected_windows, first_received_window_start, last_received_at, reported_bytes, days, limitations]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        as_of: {type: string, format: date-time}
        authorization_history_start: {type: string, format: date-time, description: Cutover when producer authorization coverage began to be recorded; earlier reporting intervals remain unknown.}
        first_received_window_start: {type: string, format: date-time, nullable: true, description: Earliest received window in the requested period; null when no batches were received. This is not the producer authorization start.}
        last_received_at: {type: string, format: date-time, nullable: true, description: Receipt time of the most recently received batch in the requested period; use with as_of to assess report freshness.}
        coverage: {type: string, enum: [authorized_producers], description: Completeness is measured over explicitly operator-authorized producers and account mappings only.}
        history_complete: {type: boolean, description: True when the entire requested interval begins at or after the recorded authorization-history cutover.}
        complete: {type: boolean, description: True only when authorization history covers the request, at least one expected producer window exists, every expected window arrived, and there are no reported measurement gaps.}
        expected_windows: {type: integer, format: int64, minimum: 0, description: Expected producer/account minute windows derived from retained authorization periods.}
        missing_windows: {type: integer, format: int64, minimum: 0, description: Expected minute windows for which no producer batch was received.}
        unexpected_windows: {type: integer, format: int64, minimum: 0, description: Received account windows outside retained authorization periods.}
        reported_bytes: {type: string, pattern: '^[0-9]+$', description: Exact decimal bytes reported in received batches only.}
        days: {type: array, maxItems: 94, items: {$ref: '#/components/schemas/RelayUsageDay'}}
        limitations: {type: array, items: {type: string}}
    BillingPayment:
      type: object
      additionalProperties: false
      required: [period_start, period_end, currency, device_minor, relay_minor, total_minor, state, updated_at]
      properties:
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        currency: {type: string, enum: [USD]}
        device_minor: {type: integer, format: int64, minimum: 0}
        relay_minor: {type: integer, format: int64, minimum: 0}
        total_minor: {type: integer, format: int64, minimum: 0}
        state: {type: string, enum: [not_queued, ready, submitting, reconcile, checkout, paid, past_due, operator_hold]}
        checkout_url: {type: string, format: uri}
        updated_at: {type: string, format: date-time}
    BillingPaymentNoticeFeed:
      type: object
      additionalProperties: false
      required: [notices]
      properties:
        notices: {type: array, items: {$ref: '#/components/schemas/BillingPaymentFailureNotice'}}
    BillingPaymentFailureNotice:
      type: object
      additionalProperties: false
      required: [period_start, period_end, created_at]
      properties:
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    RelayUsageDay:
      type: object
      additionalProperties: false
      required: [date, reported_bytes, reported_windows, gap_windows, expected_windows, missing_windows, unexpected_windows, gap_reasons]
      properties:
        date: {type: string, format: date}
        reported_bytes: {type: string, pattern: '^[0-9]+$'}
        reported_windows: {type: integer, format: int64, minimum: 0}
        gap_windows: {type: integer, format: int64, minimum: 0}
        expected_windows: {type: integer, format: int64, minimum: 0}
        missing_windows: {type: integer, format: int64, minimum: 0}
        unexpected_windows: {type: integer, format: int64, minimum: 0}
        gap_reasons: {type: array, items: {type: string, enum: [unresolved_mapping, capacity, overflow, clock, observation_lost]}}
    RelayAlertFeed:
      type: object
      additionalProperties: false
      required: [period_start, period_end, as_of, coverage_complete, alerts]
      properties:
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        as_of: {type: string, format: date-time}
        coverage_complete: {type: boolean, description: False means amounts are lower bounds and must not be treated as final usage.}
        coverage_warning: {type: string, description: Present when usage coverage is incomplete.}
        alerts: {type: array, items: {$ref: '#/components/schemas/RelayAlertCandidate'}}
    RelayAlertCandidate:
      type: object
      additionalProperties: false
      required: [period_start, period_end, schedule_version, target, threshold_percent, reported_bytes, threshold_bytes, as_of, usage_complete]
      properties:
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        schedule_version: {type: string}
        target: {type: string, enum: [included_allowance, spending_cap]}
        threshold_percent: {type: integer, enum: [75, 90, 100]}
        reported_bytes: {type: string, pattern: '^[0-9]+$'}
        threshold_bytes: {type: string, pattern: '^[0-9]+$'}
        as_of: {type: string, format: date-time}
        usage_complete: {type: boolean, description: False means this event was evaluated from lower-bound usage coverage.}
    RelayCapDraft:
      type: object
      additionalProperties: false
      required: [period, overage_limit_minor, acknowledge_interruption]
      properties:
        period: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}
        overage_limit_minor: {type: integer, format: int64, minimum: 0, description: USD cents; byte budgets truncate down.}
        acknowledge_interruption: {type: boolean, enum: [true]}
    RelayCreditRequest:
      type: object
      additionalProperties: false
      required: [relay_id, deployment_id, mapping_version, generation, request_id, requested_bytes, signature]
      properties:
        relay_id: {type: string, minLength: 1, maxLength: 64}
        deployment_id: {type: string, minLength: 1, maxLength: 128}
        mapping_version: {type: string, pattern: '^[0-9a-f]{64}$'}
        generation: {type: string, pattern: '^[0-9a-f]{32}$'}
        request_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        requested_bytes: {type: string, pattern: '^[1-9][0-9]*$'}
        signature: {type: string, format: byte}
    RelayCreditGrant:
      type: object
      required: [grant_id, account_id, period_start, period_end, relay_id, generation, mapping_version, schedule_version, cap_revision, requested_bytes, granted_bytes, created_at]
      properties:
        grant_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        account_id: {type: string}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        relay_id: {type: string}
        generation: {type: string, pattern: '^[0-9a-f]{32}$'}
        mapping_version: {type: string, pattern: '^[0-9a-f]{64}$'}
        schedule_version: {type: string}
        cap_revision: {type: integer, format: int64, minimum: 1}
        requested_bytes: {type: string, pattern: '^[1-9][0-9]*$'}
        granted_bytes: {type: string, pattern: '^[1-9][0-9]*$'}
        created_at: {type: string, format: date-time}
    RelayCreditSurrender:
      type: object
      additionalProperties: false
      required: [grant_id, relay_id, deployment_id, mapping_version, generation, consumed_bytes, signature]
      properties:
        grant_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        relay_id: {type: string, minLength: 1, maxLength: 64}
        deployment_id: {type: string, minLength: 1, maxLength: 128}
        mapping_version: {type: string, pattern: '^[0-9a-f]{64}$'}
        generation: {type: string, pattern: '^[0-9a-f]{32}$'}
        consumed_bytes: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        signature: {type: string, format: byte}
    RelayCap:
      type: object
      additionalProperties: false
      required: [enabled, period_start, period_end, currency, acknowledged_interruption]
      properties:
        enabled: {type: boolean}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        currency: {type: string, enum: [USD]}
        overage_limit_minor: {type: integer, format: int64, minimum: 0}
        acknowledged_interruption: {type: boolean}
        effective_at: {type: string, format: date-time, description: Initial cap activation time after outstanding uncapped relay leases expire.}
    DeviceInvitationDraft:
      type: object
      additionalProperties: false
      required: [name, groups]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        groups: {type: array, minItems: 1, maxItems: 100, items: {type: string}}
        domain_id: {type: string, description: 'Places the enrolling device into this mesh domain (ADR-0032) rather than the account root.'}
    DeviceInvitation:
      type: object
      required: [id, name, groups, state, expires_at, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        groups: {type: array, items: {type: string}}
        state: {type: string, enum: [pending, redeemed, expired, revoked]}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        redeemed_at: {type: string, format: date-time}
        credential: {type: string, description: Bearer credential returned only by creation. Never included in list or revocation responses.}
        domain_id: {type: string, description: 'The mesh domain (ADR-0032) the enrolling device will be placed in, or absent for the account root.'}
    Error:
      type: object
      required: [code, message]
      properties: {code: {type: string}, message: {type: string}, request_id: {type: string}}
    Page:
      type: object
      required: [next_cursor]
      properties: {next_cursor: {type: string, nullable: true}}
    Node:
      type: object
      required: [handle, name, platform, user_id, tags, dns_label, enabled, created_at, posture]
      properties:
        handle: {type: string, readOnly: true}
        name: {type: string}
        platform: {type: string}
        user_id: {type: string}
        tags: {type: array, items: {type: string}}
        domain_id: {type: string, description: 'The mesh domain (ADR-0032) this peer is placed in, or absent for the account root.'}
        dns_label: {type: string, description: 'Root-relative peer DNS label, including the relative domain path. Append the account root suffix exactly once to form the complete DNS name.'}
        enabled: {type: boolean}
        expires_at: {type: string, nullable: true, format: date-time}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, nullable: true, format: date-time}
        posture: {$ref: '#/components/schemas/NodePosture'}
    NodeUpdate:
      type: object
      additionalProperties: false
      properties: {name: {type: string}, domain_id: {type: string}, tags: {type: array, items: {type: string}}, expires_at: {type: string, nullable: true, format: date-time}, enabled: {type: boolean}}
    MyDevice:
      type: object
      required: [handle, name, platform, last_seen_at]
      properties: {handle: {type: string}, name: {type: string}, platform: {type: string}, last_seen_at: {type: string, nullable: true, format: date-time}}
    DeviceRename:
      type: object
      required: [name]
      additionalProperties: false
      properties: {name: {type: string, minLength: 1}}
    EnrollmentSettings:
      type: object
      required: [server_kem_pin, server_verify_pin, control_minimum_version]
      properties:
        server_kem_pin: {type: string, description: Hex ML-KEM-1024 public key}
        server_verify_pin: {type: string, description: Hex ML-DSA-87 verification key}
        control_minimum_version: {type: integer, enum: [1]}
    DeviceEnrollment:
      type: object
      required: [key, expires_at]
      properties: {key: {type: string, readOnly: true, description: Returned once when the one-use device key is created.}, expires_at: {type: string, format: date-time}}
    AccessExplanation:
      type: object
      required: [destination, rule, group, changed_at, changed_by]
      properties: {destination: {type: string}, rule: {type: integer, minimum: 1}, group: {type: string}, changed_at: {type: string, format: date-time}, changed_by: {type: string}}
    MySession:
      type: object
      description: >-
        One control-channel connection by one of the caller's own devices.
        ended_at is null while the session is live. ip is the address the
        coordination server saw the connection come from, which behind a
        reverse proxy is the proxy rather than the device: the control channel
        authenticates itself (ADR-0011) and does not read a forwarded-for
        header, because a header the client sets is not evidence of where the
        client is.
      required: [started_at, device]
      properties: {started_at: {type: string, format: date-time}, ended_at: {type: string, nullable: true, format: date-time}, device: {type: string, description: The device name its owner gave it}, ip: {type: string, nullable: true}}
    NodePage:
      allOf: [{$ref: '#/components/schemas/Page'}, {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Node'}}}}]
    NodePaths:
      type: object
      required: [observed_at, paths]
      properties: {observed_at: {type: string, nullable: true, format: date-time}, paths: {type: array, items: {$ref: '#/components/schemas/PathObservation'}}}
    PathObservation:
      type: object
      required: [peer_handle, kind, observed_at, tx_bytes, rx_bytes]
      properties: {peer_handle: {type: string}, kind: {type: string, enum: [direct, relay, turn, unreachable]}, endpoint: {type: string, nullable: true}, relay_id: {type: string, nullable: true}, since: {type: string, nullable: true, format: date-time}, observed_at: {type: string, format: date-time}, tx_bytes: {type: integer, minimum: 0, description: 'Bytes sent to this peer, a running total for the session'}, rx_bytes: {type: integer, minimum: 0, description: 'Bytes received from this peer, a running total for the session'}}
    NodePosture:
      type: object
      required: [status, observed_at]
      properties: {status: {type: string, enum: [pq, lattice_only, stale, unknown]}, suite: {type: string, nullable: true}, psk_epoch: {type: integer, nullable: true, minimum: 0}, lattice_only: {type: boolean}, observed_at: {type: string, nullable: true, format: date-time}}
    PolicyWrite:
      type: object
      required: [document]
      properties: {document: {type: string, description: HuJSON policy document.}}
    PolicyVersion:
      type: object
      required: [version, document, author, created_at]
      properties: {version: {type: integer, minimum: 1}, document: {type: string}, author: {type: string}, created_at: {type: string, format: date-time}}
    PolicyVersionPage:
      allOf: [{$ref: '#/components/schemas/Page'}, {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/PolicyVersion'}}}}]
    PolicyValidation:
      type: object
      required: [valid, diagnostics]
      properties: {valid: {type: boolean}, diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}}
    Diagnostic:
      type: object
      required: [severity, message, line, column]
      properties: {severity: {type: string, enum: [error, warning]}, message: {type: string}, line: {type: integer, minimum: 1}, column: {type: integer, minimum: 1}}
    PolicyPreview:
      type: object
      required: [added, removed]
      properties: {added: {type: array, items: {$ref: '#/components/schemas/Flow'}}, removed: {type: array, items: {$ref: '#/components/schemas/Flow'}}, ssh_added: {type: array, items: {$ref: '#/components/schemas/SshGrant'}}, ssh_removed: {type: array, items: {$ref: '#/components/schemas/SshGrant'}}}
    Flow:
      type: object
      required: [source, destination, protocol, ports]
      properties: {source: {type: string}, destination: {type: string}, protocol: {type: string}, ports: {type: string}}
    SshGrant:
      type: object
      description: 'An "ssh" rule''s effect, described the way the console renders it — "SSH access granted: principal → target" — rather than as a host:port flow, since ssh gating has no ports or protocol of its own (plans/phase-6/07-acl-gated-ssh.md §3.1).'
      required: [principal, target]
      properties: {principal: {type: string}, target: {type: string}}
    PolicyTestResult:
      type: object
      required: [passed, results]
      properties: {passed: {type: boolean}, results: {type: array, items: {type: object, required: [name, passed], properties: {name: {type: string}, passed: {type: boolean}, message: {type: string}}}}}
    RelayPublication:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: {type: string, enum: [legacy, services]}
    RelayService:
      type: object
      required: [id, ponor_id]
      additionalProperties: false
      properties:
        id: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$'}
        ponor_id: {type: string, minLength: 1, description: Existing account-local Ponor registry ID.}
        turn_id: {type: string, description: Optional existing account-local TURN registry ID.}
        backend_kind: {type: string, enum: [external, coturn-companion], description: Required with turn_id; omitted without it. Deployment ownership only.}
        backend_operator: {type: string, minLength: 1, maxLength: 256, description: Required with turn_id; identifies who operates the backend.}
    RelayServiceView:
      allOf:
        - {$ref: '#/components/schemas/RelayService'}
        - type: object
          required: [ponor_present, turn_present]
          properties:
            ponor_present: {type: boolean, description: Referenced Ponor registry entry exists in this account; not a health result.}
            turn_present: {type: boolean, description: Referenced TURN registry entry exists in this account; false when TURN is absent; not a health result.}
    RelayCreate:
      type: object
      required: [address, identity_key, region]
      additionalProperties: false
      properties: {address: {type: string}, identity_key: {type: string, format: byte}, region: {type: string}, tls_server_name: {type: string}, location: {$ref: '#/components/schemas/RelayLocation'}}
    Relay:
      allOf: [{$ref: '#/components/schemas/RelayCreate'}, {type: object, required: [id, health], properties: {id: {type: string, readOnly: true, description: Derived from identity_key; never accepted from callers.}, health: {$ref: '#/components/schemas/RelayHealth'}, location_source: {type: string, readOnly: true, enum: [declared, detected], description: 'Which source location came from (ADR-0048) -- detected (cloud instance metadata) overrides declared (operator-entered) when both exist. Absent along with location when neither source has one. Server-derived; never accepted from callers, so it lives here rather than on RelayCreate.'}}}]
    RelayHealth:
      type: object
      required: [source, last_confirmed_at, admission_state]
      properties: {source: {type: string, enum: [roster_mtime, relay_telemetry]}, last_confirmed_at: {type: string, nullable: true, format: date-time}, sessions: {type: integer, nullable: true, minimum: 0}, bytes: {type: integer, nullable: true, minimum: 0}, admission_state: {type: string, enum: [confirmed, stale, unknown]}}
    # Operator-declared NOC-map position (ADR-0046 §1) -- never GeoIP, never
    # inferred from Relay.address. Absent on a Relay means "location unknown."
    RelayLocation:
      type: object
      required: [lat, lon]
      additionalProperties: false
      properties: {lat: {type: number, minimum: -90, maximum: 90}, lon: {type: number, minimum: -180, maximum: 180}, label: {type: string}}
    RegionDemand:
      type: object
      required: [region, account_id, rtt_under_20ms, rtt_20_to_50ms, rtt_50_to_100ms, rtt_over_100ms]
      properties: {region: {type: string}, account_id: {type: string}, rtt_under_20ms: {type: integer, minimum: 0}, rtt_20_to_50ms: {type: integer, minimum: 0}, rtt_50_to_100ms: {type: integer, minimum: 0}, rtt_over_100ms: {type: integer, minimum: 0}}
    AnchorHistogramEntry:
      type: object
      required: [provider, region, bucket, count]
      properties: {provider: {type: string}, region: {type: string}, bucket: {type: string}, count: {type: integer, minimum: 0}}
    # The three schemas below mirror karst-scaler's own advise::Recommendation
    # / PoolRecommendation / Constraint (bins/karst-scaler/src/advise.rs) and
    # metrics_http::Snapshot -- the exact shape its loopback /recommendations
    # endpoint serves, proxied unchanged by GET /scaler/recommendations above.
    ScalerPoolRecommendation:
      type: object
      required: [pool_id, desired_nodes, cost_delta, binding_constraint]
      properties: {pool_id: {type: string}, desired_nodes: {type: integer, minimum: 0}, cost_delta: {type: number}, binding_constraint: {type: string, enum: [latency, availability, headroom, residency, budget, capacity, none]}}
    ScalerRecommendation:
      type: object
      required: [pools, total_cost_delta, baseline_cost]
      properties: {pools: {type: array, items: {$ref: '#/components/schemas/ScalerPoolRecommendation'}}, total_cost_delta: {type: number}, baseline_cost: {type: number}}
    ScalerRecommendations:
      type: object
      required: [tick_unix, recommendation, configured_nodes]
      properties: {tick_unix: {type: integer}, recommendation: {$ref: '#/components/schemas/ScalerRecommendation'}, configured_nodes: {type: object, additionalProperties: {type: integer, minimum: 0}, description: 'pool_id -> pool.min_nodes, the "configured baseline" -- not an introspected live count (ADR-0045 §7 Phase 1 has no driver interface yet).'}}
    # Issue #381: advise_loop::LatencyBreach/RegionCandidate
    # (bins/karst-scaler/src/advise_loop.rs) and metrics_http::Suggestions
    # -- the exact shape its loopback /suggestions endpoint serves,
    # proxied unchanged by GET /scaler/suggestions above.
    ScalerLatencyBreach:
      type: object
      required: [region, p95_rtt_ms, threshold_ms]
      properties: {region: {type: string}, p95_rtt_ms: {type: number}, threshold_ms: {type: number}}
    ScalerRegionCandidate:
      type: object
      required: [provider, region, estimated_p95_rtt_ms, observations]
      properties: {provider: {type: string}, region: {type: string}, estimated_p95_rtt_ms: {type: number}, observations: {type: integer}}
    ScalerSuggestions:
      type: object
      required: [tick_unix, latency_breaches, region_candidates]
      properties: {tick_unix: {type: integer}, latency_breaches: {type: array, items: {$ref: '#/components/schemas/ScalerLatencyBreach'}}, region_candidates: {type: array, items: {$ref: '#/components/schemas/ScalerRegionCandidate'}}}
    # Issues #356/#379/#380: ADR-0045 §7's Phase 1 (manual)/Phase 2
    # (automated) actuation switch -- one deployment-wide value, not
    # per-pool.
    ScalingMode:
      type: object
      required: [mode]
      additionalProperties: false
      properties: {mode: {type: string, enum: [automated, manual]}}
    # One (provider, region) pair on ADR-0045 §4c's deployment-wide region
    # allowlist (package regionallow). provider/region are both opaque,
    # unvalidated strings -- not checked against any known-provider or
    # known-region list, matching Location's own "kind" field precedent.
    AllowedRegion:
      type: object
      required: [provider, region]
      additionalProperties: false
      properties: {provider: {type: string, description: 'e.g. "aws", "aws-gov-cloud", "azure", "azure-gov-cloud", "gcp" -- not validated against this set.'}, region: {type: string, description: 'A provider region code, or an AWS local zone code -- both are opaque strings here.'}}
    FirstRunState:
      type: object
      required: [completed]
      properties: {completed: {type: boolean, description: 'Whether the account has finished the console''s first-run setup wizard (default domain + initial groups). A brand-new account defaults to false; an account that existed before this feature shipped defaults to true.'}, completed_at: {type: string, format: date-time}}
    TutorialMode:
      type: object
      required: [enabled]
      additionalProperties: false
      properties: {enabled: {type: boolean, description: 'Whether per-page "what is this" guidance text is shown across the console. Defaults to true.'}}
    # ADR-0045 §6 addendum: admin-entered AWS/Azure/GCP credentials, stored
    # encrypted at rest by package cloudaccounts. "read_only" can only ever
    # list an account's regions/zones. "read_write" is stored for a future
    # provisioning path and does not currently actuate anything either --
    # see the Settings page's own copy and the package's doc comment.
    CloudAccountCreate:
      type: object
      required: [provider, mode, secret]
      additionalProperties: false
      properties:
        provider: {type: string, enum: [aws, azure, gcp]}
        mode: {type: string, enum: [read_only, read_write]}
        label: {type: string}
        secret: {type: object, description: 'Provider-shaped credential object. AWS: {access_key_id, secret_access_key, session_token?}. Azure: {tenant_id, client_id, client_secret, subscription_id}. GCP: {project_id, service_account_key: <the downloaded JSON key, as an object>}.'}
    CloudAccount:
      type: object
      required: [id, provider, mode, created_at]
      properties:
        id: {type: string, readOnly: true}
        provider: {type: string, enum: [aws, azure, gcp]}
        mode: {type: string, enum: [read_only, read_write]}
        label: {type: string}
        created_at: {type: string, format: date-time, readOnly: true}
    # One region/zone as discovered live from a cloud account, enriched with
    # cloudcatalog's static coordinates where available -- lat/lon are
    # absent, not zero, when the catalog has no entry yet for this code.
    DiscoveredRegion:
      type: object
      required: [code, kind, enabled]
      additionalProperties: false
      properties:
        code: {type: string}
        name: {type: string}
        kind: {type: string, enum: [region, local_zone, zone]}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
        parent_region: {type: string, description: 'Set for a kind other than region -- the region to call the enable endpoint against.'}
        enabled: {type: boolean, description: 'True for a region and an already opted-in local zone. False only for a read_write credential''s not-yet-opted-in local zone, offered for enableCloudAccountRegion.'}
    TurnServerCreate:
      type: object
      required: [uri]
      additionalProperties: false
      properties: {uri: {type: string, description: 'A turn: or turns: URI (RFC 8656 §3.1 / RFC 7065), e.g. turn:turn.example.com:3478.'}, region: {type: string}, location: {$ref: '#/components/schemas/RelayLocation'}}
    TurnServer:
      allOf: [{$ref: '#/components/schemas/TurnServerCreate'}, {type: object, required: [id], properties: {id: {type: string, readOnly: true, description: Derived from uri; never accepted from callers.}}}]
    # The NOC map's admin-authorized "possible locations" registry (ADR-0046
    # §1 extension) -- a site an operator has declared this deployment may
    # place infrastructure at, independent of whether anything is deployed
    # there yet. Additive, not a foreign key: a Relay/TurnServer/etc. may
    # still declare a location that is not in this registry.
    LocationCreate:
      type: object
      required: [lat, lon]
      additionalProperties: false
      properties: {lat: {type: number, minimum: -90, maximum: 90}, lon: {type: number, minimum: -180, maximum: 180}, label: {type: string}, kind: {type: string, description: 'Free-text grouping tag ("datacenter", "aws-region", "aws-local-zone", ...), not validated against a fixed list.'}}
    Location:
      allOf: [{$ref: '#/components/schemas/LocationCreate'}, {type: object, required: [id], properties: {id: {type: string, readOnly: true, description: Derived from the entry's own content; never accepted from callers.}}}]
    # One gateway group's declared NOC-map location (package grouplocation)
    # -- what places an exit-node/subnet-router marker, since a route only
    # ever names peer_groups, never a single machine.
    GroupLocation:
      type: object
      required: [group_id, lat, lon]
      properties: {group_id: {type: string, readOnly: true}, lat: {type: number, minimum: -90, maximum: 90}, lon: {type: number, minimum: -180, maximum: 180}, label: {type: string}}
    # The NOC map's one discriminated-union response shape (ADR-0046 §1's
    # full component list) -- see api/nodes.go's own nocComponent doc comment.
    NocComponent:
      type: object
      required: [kind, id, label]
      properties:
        kind: {type: string, enum: [relay, turn, route, control_plane, bedrock]}
        id: {type: string}
        label: {type: string}
        health: {type: string, enum: [confirmed, stale, unknown]}
        location: {$ref: '#/components/schemas/RelayLocation'}
        # bytes/packets/ingress_bytes/ingress_packets: issues #281, #371,
        # #372. Aggregate egress and ingress throughput, populated only
        # for kind: route (summed across every route the group serves).
        # Absent, not zero, until some gateway for the group has
        # self-reported at least once.
        bytes: {type: integer, format: int64}
        packets: {type: integer, format: int64}
        ingress_bytes: {type: integer, format: int64}
        ingress_packets: {type: integer, format: int64}
    BedrockStatus:
      type: object
      required: [mode, quorum, roots, authorities, uncovered_handles]
      # uncovered_handles is the server's answer to "who would be cut off", and
      # PUT /bedrock/mode compares its acknowledgment against exactly this set.
      # A client that computes its own list from node liveness gets a 409:
      # coverage is a property of the signed log, not of whether a node is up.
      # The fields below zone are present only once a log has been verified.
      properties: {mode: {type: string, enum: [off, advisory, enforcing]}, quorum: {type: integer, minimum: 1}, roots: {type: array, items: {$ref: '#/components/schemas/Authority'}}, authorities: {type: array, items: {$ref: '#/components/schemas/Authority'}}, uncovered_handles: {type: array, items: {type: string}, uniqueItems: true}, zone: {type: string}, head: {type: string}, head_seq: {type: integer, minimum: 0}, disabled: {type: boolean}, covered_count: {type: integer, minimum: 0}, location: {$ref: '#/components/schemas/RelayLocation'}}
    Authority:
      type: object
      required: [id, name, status]
      properties: {id: {type: string}, name: {type: string}, status: {type: string, enum: [active, retired, unavailable]}}
    BedrockLogPage:
      allOf: [{$ref: '#/components/schemas/Page'}, {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/BedrockLogEntry'}}}}]
    BedrockLogEntry:
      type: object
      required: [sequence, hash, created_at, verified]
      properties: {sequence: {type: integer, minimum: 1}, hash: {type: string}, created_at: {type: string, format: date-time}, verified: {type: boolean}}
    ChainVerification:
      type: object
      required: [valid, head]
      properties: {valid: {type: boolean}, verified: {type: boolean}, first_bad_sequence: {type: integer, nullable: true, minimum: 1}, head: {$ref: '#/components/schemas/AuditHead'}, reason: {type: string}}
    SigningRequest:
      type: object
      required: [id, created_at, payload_hash]
      properties: {id: {type: string}, created_at: {type: string, format: date-time}, payload_hash: {type: string}}
    SignedBundle:
      type: object
      required: [format, payload]
      properties: {format: {type: string, const: bedrock-signed-bundle-v1}, payload: {type: string, format: byte}}
    BedrockBootstrapBundle:
      type: object
      required: [format, payload]
      properties: {format: {type: string, const: bedrock-log-v1}, payload: {type: string, format: byte}}
    BedrockModeWrite:
      type: object
      required: [mode, acknowledged_cut_off_handles]
      properties: {mode: {type: string, enum: [off, advisory, enforcing]}, acknowledged_cut_off_handles: {type: array, items: {type: string}, uniqueItems: true}}
    AcknowledgmentMismatch:
      type: object
      required: [code, message, required_cut_off_handles]
      properties: {code: {type: string, const: acknowledgment_mismatch}, message: {type: string}, required_cut_off_handles: {type: array, items: {type: string}, uniqueItems: true}}
    PostureAggregate:
      type: object
      required: [as_of, window_start, observed_sessions, eligible_sessions, pq_covered_sessions, lattice_only_sessions, stale_nodes, suites]
      properties: {as_of: {type: string, format: date-time}, window_start: {type: string, format: date-time}, observed_sessions: {type: integer, minimum: 0}, eligible_sessions: {type: integer, minimum: 0}, pq_covered_sessions: {type: integer, minimum: 0}, lattice_only_sessions: {type: integer, minimum: 0}, stale_nodes: {type: integer, minimum: 0}, suites: {type: object, additionalProperties: {type: integer, minimum: 0}}}
    SessionPage:
      allOf: [{$ref: '#/components/schemas/Page'}, {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/SessionPosture'}}}}]
    SessionPosture:
      type: object
      required: [node_handle, peer_handle, status, lattice_only, observed_at]
      properties: {node_handle: {type: string}, peer_handle: {type: string}, status: {type: string, enum: [pq, lattice_only, stale, unknown]}, suite: {type: string, nullable: true}, psk_epoch: {type: integer, nullable: true}, lattice_only: {type: boolean}, observed_at: {type: string, format: date-time}}
    AuditPage:
      allOf: [{$ref: '#/components/schemas/Page'}, {type: object, required: [items, anchor], properties: {items: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}, anchor: {$ref: '#/components/schemas/AuditAnchor'}}}]
    AuditEntry:
      type: object
      required: [sequence, created_at, actor, action, target, previous_hash, hash]
      properties: {sequence: {type: integer, minimum: 1}, created_at: {type: string, format: date-time}, actor: {type: string}, action: {type: string}, target: {type: string}, detail: {type: string}, previous_hash: {type: string}, hash: {type: string}}
    AuditHead:
      type: object
      required: [sequence, hash]
      properties: {sequence: {type: integer, minimum: 0}, hash: {type: string}}
    AuditAnchor:
      type: object
      required: [last_anchored_sequence, entries_since_anchor, contradicts_anchor]
      properties: {last_anchored_sequence: {type: integer, nullable: true, minimum: 1}, last_anchored_at: {type: string, nullable: true, format: date-time}, entries_since_anchor: {type: integer, minimum: 0, description: 'The caller''s own entries since the anchor (ADR-0035). The audit log is one deployment-wide hash chain, but this count is scoped to the caller''s account and unaffected by other tenants'' activity.'}, contradicts_anchor: {type: boolean, description: 'true when the audit log no longer matches its recorded anchor (ADR-0016 VerifyAnchored) — the server has truncated or rewritten history since it was last anchored. False both when the log is intact and when there is no anchor to contradict.'}}
    AuditSinkWrite:
      type: object
      required: [kind, endpoint]
      properties: {kind: {type: string, enum: [webhook, syslog]}, endpoint: {type: string}}
    AuditSink:
      allOf: [{$ref: '#/components/schemas/AuditSinkWrite'}, {type: object, required: [id], properties: {id: {type: string, readOnly: true}}}]
