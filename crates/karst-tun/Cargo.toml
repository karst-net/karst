[package]
name = "karst-tun"
description = "platform TUN/TAP abstraction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# docs/adr/0026-macos-network-extension-backend.md: on target_os = "macos",
# selects the fd-adoption `Tun` (`mobile.rs`, the same backend iOS already
# uses) over the LaunchDaemon one (`macos.rs`) that ships by default. Inert
# everywhere else — `mobile.rs`'s macOS-shaped `impl Tun` block is gated on
# `all(target_os = "macos", feature = "network-extension")`, so enabling this
# on Linux, Windows, or without `target_os = "macos"` compiles nothing new.
[features]
network-extension = []

[dependencies]
karst-proto.workspace = true
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# mobile.rs's set_nonblocking only — from_fd itself needs no FFI beyond std's
# own OwnedFd/File.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
libc = "0.2"

# ADR-0017: Win32 declarations only, no Wintun Cargo wrapper. The DLL itself
# is loaded at runtime via `LoadLibraryExW` from the protected install
# directory — see `sys_windows`, not this dependency.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
