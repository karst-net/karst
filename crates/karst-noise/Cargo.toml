[package]
name = "karst-noise"
description = "PHREATIC handshake state machine (sans-io)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
karst-crypto.workspace = true
sha2 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# "zeroize": without it, x25519-dalek's StaticSecret/EphemeralSecret have no
# Drop impl at all and every X25519 secret this crate holds — static and
# ephemeral — leaks unzeroized on drop. Same class of gap as karst-crypto's
# aead.rs module note documents for ml-kem/ml-dsa/aes-gcm, found alongside it.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", default-features = false }

[dev-dependencies]
karst-proto.workspace = true
