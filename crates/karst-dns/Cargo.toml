[package]
name = "karst-dns"
description = "KarstDNS resolver and split-DNS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
hickory-proto = { version = "0.26.1", default-features = false }
thiserror = "2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# DNS-over-TLS (RFC 7858) upstream transport — ADR-0034. Deliberately no
# `prefer-post-quantum`, unlike `bins/karstd/src/relay_tls.rs`'s Ponor
# config: a public or self-hosted third-party DNS resolver will not offer
# Karst's PQ/CNSA suite, and ADR-0034 explicitly does not require it here.
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"
# Parses a peer certificate far enough to hash its SubjectPublicKeyInfo for
# ADR-0034's optional pinning. RustCrypto family, consistent with `der`/
# `spki` already in this workspace's dependency tree via `ml-dsa`'s `pkcs8`
# dependency, rather than the differently-styled `x509-parser`.
x509-cert = "0.2"
sha2 = { version = "0.10", default-features = false }

[target.'cfg(windows)'.dependencies]
# A fully safe wrapper (part of the microsoft/windows-rs project) over the
# registry APIs the Name Resolution Policy Table lives in. Its own unsafe FFI
# stays inside that crate, which is why `karst-dns`'s crate-wide
# `#![forbid(unsafe_code)]` can depend on it directly rather than needing a
# `sys_windows`-pattern wrapper — the same reasoning `bins/karstd`'s
# `Cargo.toml` gives for `windows-service`.
# Pinned below the newest release (0.100, which requires Rust 1.95): the
# workspace MSRV is 1.88 (`rust-toolchain.toml`), and 0.6 is the newest
# series whose own `rust-version` (1.82) fits under it. Its `Key` API is
# identical to 0.100's for everything this module calls.
windows-registry = "0.6"
# `windows-registry`'s own `Result<T>` alias points at this crate's `Error`,
# but does not re-export the type itself under a public path shorter than
# `windows_result::error::Error` — named directly here only so
# `NrptError::Registry`'s `#[source]` has a concrete type to hold.
windows-result = "0.4"

[dev-dependencies]
# Self-signed test certificates for the DoT loopback fixture, matching
# `bins/karstd/src/relay_tls.rs`'s own test pattern.
rcgen = "0.14"
