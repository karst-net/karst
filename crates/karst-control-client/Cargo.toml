[package]
name = "karst-control-client"
description = "typed client for the Go control API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
karst-crypto.workspace = true
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros"] }
tokio-stream = "0.1"
sha2 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
base64ct = { version = "1", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
hex = "0.4"
ml-dsa = "0.1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
