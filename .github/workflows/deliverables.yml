name: Build deliverables

on:
  # Packaging is deliberately push-only: pull requests exercise the same
  # source through CI without creating downloadable distribution artefacts.
  push:

permissions:
  contents: read

# Keyed on the event as well as the ref, matching ci.yml. This workflow has a
# single trigger today, so it changes nothing now — it is here so that adding a
# `schedule` or `workflow_dispatch` later cannot reintroduce the collision
# ci.yml's comment describes, where two runs on the same ref cancel each other
# because they are told they are the same thing.
concurrency:
  group: deliverables-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ## Why this builds inside a container
  #
  # A release binary carries the glibc of the machine that linked it. Built on
  # `ubuntu-latest` — glibc 2.39 — `karstd` refuses to start on Debian 12
  # (2.36) and RHEL 9 (2.34), two of the four distributions
  # plans/phase-5/09-exit-criteria.md §2 says the docs will claim. The package
  # installs perfectly first, which is what makes it a release problem rather
  # than a build problem: nothing upstream of an actual install on an actual
  # distribution can see it, and `packages-verify` below is where it was found.
  #
  # Rocky Linux 9 is RHEL 9's glibc (2.34) with public repositories and no
  # subscription, so linking there puts the floor at the oldest distribution in
  # the supported set and every newer one is forward-compatible.
  packages:
    name: Linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: rockylinux:9
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: 0.0.0+git.${{ github.sha }}
      ARCH: ${{ matrix.arch }}
    steps:
      # Before checkout, which otherwise falls back to a REST tarball and says
      # so. `curl` is excluded deliberately: the base image ships
      # `curl-minimal`, and asking for `curl` is an unresolvable file conflict.
      - name: Build prerequisites
        run: |
          dnf -y install gcc gcc-c++ cmake make perl git unzip tar gzip
      - uses: actions/checkout@v4
      # The job runs as root inside the container while the checkout belongs to
      # the runner's own user, and git refuses a repository it does not trust
      # the ownership of. Nothing in the Rust build asks git anything, so it
      # succeeds — and then `go build` stamps VCS information into the binary,
      # cannot read the repository, and fails the whole job with
      # `error obtaining VCS status: exit status 128`.
      #
      # `-buildvcs=false` would also make it build. It would do so by throwing
      # away the commit stamped into the release binary, which is worth more
      # than the line it costs to keep.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # `arduino/setup-protoc` unpacks a musl binary that will not run here, so
      # protoc comes from its own release archive.
      - name: protoc
        run: |
          case "$(uname -m)" in
            aarch64) platform=aarch_64 ;;
            x86_64)  platform=x86_64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSLo /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-${platform}.zip"
          unzip -q -o /tmp/protoc.zip -d /usr/local
          protoc --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build client and services
        run: |
          cargo build --locked --release --package karstd --package karst-cli --package karst-relay
          mkdir -p dist/packages
          install -m 0755 target/release/karstd dist/karstd
          install -m 0755 target/release/karst dist/karst
          install -m 0755 target/release/karst-relay dist/karst-relay
          (cd server && CGO_ENABLED=1 go build -trimpath -o ../dist/karst-control ./cmd/karst-control)
      - name: The glibc floor is the oldest supported distribution
        run: ./scripts/glibc-floor.sh 2.34 dist/karstd dist/karst dist/karst-relay dist/karst-control
      - name: Install nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build Debian and RPM packages
        run: |
          for package in karst-client karst-relay karst-control; do
            nfpm package --packager deb --target dist/packages/ --config "packaging/nfpm/$package.yaml"
            nfpm package --packager rpm --target dist/packages/ --config "packaging/nfpm/$package.yaml"
          done
          ls -l dist/packages
      # The same build, published twice under consecutive versions. It exists
      # only so `packages-verify` has something to upgrade *to*; it is never
      # released, and it is a separate artefact so it cannot be mistaken for
      # one. An upgrade path that is only ever exercised by real releases is
      # one that gets tested for the first time by users.
      - name: Build the upgrade fixture
        env:
          VERSION: 0.0.1+git.${{ github.sha }}
        run: |
          mkdir -p dist/upgrade-fixture
          nfpm package --packager deb --target dist/upgrade-fixture/ --config packaging/nfpm/karst-client.yaml
          nfpm package --packager rpm --target dist/upgrade-fixture/ --config packaging/nfpm/karst-client.yaml
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}-${{ github.sha }}
          path: dist/packages/*
          if-no-files-found: error
      - name: Upload the upgrade fixture
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-fixture-${{ matrix.arch }}-${{ github.sha }}
          path: dist/upgrade-fixture/*
          if-no-files-found: error

  # The gate plans/phase-5/09-exit-criteria.md §2 asks for: not "the package
  # definitions exist" but "install/upgrade/uninstall them on each documented
  # distribution". Debian 12, Ubuntu 24.04, Fedora 41 and RHEL 9 are the set
  # the docs will claim, so they are the set that gets installed on.
  #
  # `redhat/ubi9` is the RHEL 9 userland Red Hat publishes without a
  # subscription. It is the real thing for this purpose — same glibc, same rpm,
  # same paths — and the alternative is claiming support for a distribution
  # nothing ever installs on.
  packages-verify:
    name: Install ${{ matrix.arch }} on ${{ matrix.distro }}
    needs: packages
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: ["debian:12", "ubuntu:24.04", "fedora:41", "redhat/ubi9"]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}-${{ github.sha }}
          path: dist/packages/old
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-fixture-${{ matrix.arch }}-${{ github.sha }}
          path: dist/packages/new
      # Read-only mount: the script must not be able to write back into the
      # checkout, so anything it leaves behind is inside the container it
      # installed into.
      - name: Install, upgrade, uninstall
        run: |
          docker run --rm -v "$PWD:/karst:ro" "${{ matrix.distro }}" \
            bash /karst/scripts/package-verify.sh \
              /karst/dist/packages/old /karst/dist/packages/new

  # The half `packages-verify` cannot reach: it runs in containers with no PID
  # 1, so nothing there ever loads the unit file the package ships. This runs
  # the packaged node agent under a real systemd and kills it the way a crash
  # would, to prove the unit's DNS recovery hook fires from the paths the
  # package installed to — see the script header for what that does and does
  # not claim.
  packages-systemd:
    name: Packaged unit under systemd
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-amd64-${{ github.sha }}
          path: dist/packages
      - name: Start, crash, recover
        run: ./scripts/package-systemd-container.sh dist/packages

  # ## The artefacts a release is actually made of
  #
  # plans/phase-5/09-exit-criteria.md §5 lists checksums, a detached signature
  # and a per-artefact SBOM alongside the packages themselves, and singles the
  # checksums out: the portal's download page tells users to verify, and the
  # docs explain how, so the file has to exist and be right.
  #
  # Signing is conditional on the key being configured, exactly as the macOS
  # job is conditional on the Apple credentials, and for the same reason: a
  # fork and a repository that has not yet been given a release key should
  # still be able to produce and check everything else. The distinction that
  # matters is that a *tag* must not be able to produce an unsigned release, so
  # the signature is required there.
  release-artefacts:
    name: Checksums, signatures and SBOMs
    needs: [packages, packages-verify, packages-systemd, macos-package]
    runs-on: ubuntu-latest
    env:
      RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-packages-*-${{ github.sha }}
          path: dist/release
          merge-multiple: true
      # The macOS package belongs in the same set: it is an artefact of the
      # release, it needs a checksum for the same reason, and the portal's
      # download page has to be able to offer it. On a push it is unsigned and
      # Gatekeeper will refuse it — see the macos-package job — which is a
      # reason not to publish that build, not a reason to leave it out of the
      # set the release is assembled from.
      - uses: actions/download-artifact@v4
        with:
          name: macos-package-${{ github.sha }}
          path: dist/release
      - name: Checksums
        run: |
          cd dist/release
          # Sorted, so the file is byte-identical for identical inputs and a
          # diff between two releases is about the artefacts and not the order
          # the runner happened to download them in.
          # `.sha256` files are the macOS job's own single-file checksum; listing
          # a checksum file inside the checksum file helps nobody.
          sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name '*.sha256' -printf '%P\n' | sort) > SHA256SUMS
          cat SHA256SUMS
      - name: Sign the checksums
        if: env.RELEASE_GPG_KEY != ''
        run: |
          printf '%s' "$RELEASE_GPG_KEY" | base64 --decode | gpg --batch --import
          gpg --batch --yes --armor --detach-sign --output dist/release/SHA256SUMS.asc dist/release/SHA256SUMS
          gpg --batch --verify dist/release/SHA256SUMS.asc dist/release/SHA256SUMS
      # A tag is a release. The check is separate from the signing step above
      # because a step that is skipped is a step that is green, and "the
      # signature was skipped on a tag" must be a failure rather than a silence.
      - name: A tagged release must be signed
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test -f dist/release/SHA256SUMS.asc || {
            echo "::error::a tag produced no detached signature; RELEASE_GPG_KEY is not configured"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: SBOMs
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.7
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          mkdir -p dist/release/sbom
          # One SBOM per shipped binary rather than one for the workspace: an
          # SBOM is a claim about an artefact, and "something in this repository
          # depends on it" is not that claim.
          cargo cyclonedx --format json --all
          for binary in karstd karst-cli karst-relay; do
            find bins/$binary -name '*.cdx.json' -exec cp {} "dist/release/sbom/$binary.cdx.json" \;
          done
          (cd server && "$(go env GOPATH)/bin/cyclonedx-gomod" app -json -main cmd/karst-control \
            -output ../dist/release/sbom/karst-control.cdx.json)
          ls -l dist/release/sbom
      # The portal's download page reads this. Generated from the artefacts in
      # this directory rather than written by hand, so a checksum on the page
      # cannot disagree with the file it describes — and generated *here*,
      # after the macOS package has been collected, so it lists everything a
      # release actually contains.
      - name: Portal download manifest
        run: |
          ./scripts/release-manifest.sh dist/release dist/release/manifest.json
          cat dist/release/manifest.json
      - name: Upload the release set
        uses: actions/upload-artifact@v4
        with:
          name: release-artefacts-${{ github.sha }}
          path: dist/release/**
          if-no-files-found: error

  images:
    name: Container images (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            file: deploy/images/karstd.Dockerfile
            image: karstd
          - name: relay
            file: deploy/images/karst-relay.Dockerfile
            image: karst-relay
          - name: control
            file: deploy/images/karst-control.Dockerfile
            image: karst-control
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: local/${{ matrix.image }}:${{ github.sha }}

  # A release image is a digest, not a tag: a tag may move after an operator
  # has inspected it.  This job consequently pushes and signs only immutable
  # digests from release tags. The ordinary `images` job above remains the
  # build-only check for every push and never receives registry or OIDC write
  # credentials.
  publish-images:
    name: Publish and sign container images (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # GitHub OIDC token for keyless Cosign signing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            file: deploy/images/karstd.Dockerfile
            image: karstd
          - name: relay
            file: deploy/images/karst-relay.Dockerfile
            image: karst-relay
          - name: control
            file: deploy/images/karst-control.Dockerfile
            image: karst-control
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        # v4.1.2. Pinning the commit makes the signing dependency itself
        # reproducible; update the comment and SHA together.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Build and publish ${{ matrix.name }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/karst-net/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/karst-net/${{ matrix.image }}:sha-${{ github.sha }}
      - name: Sign the immutable image digest
        env:
          IMAGE: ghcr.io/karst-net/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify the release identity and signature
        env:
          IMAGE: ghcr.io/karst-net/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/deliverables.yml@${{ github.ref }}
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          test -n "$DIGEST"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            "$IMAGE@$DIGEST"

  # The macOS client package: two architectures joined with `lipo`, a .pkg, and
  # — when the Apple credentials exist — signing, notarization and stapling.
  #
  # ## Why signing is conditional and not required here
  #
  # The Developer ID certificates come from an Apple Developer Program
  # organisation membership that takes weeks to obtain and can stall on a
  # legal-entity mismatch (plans/phase-5/06-macos-client.md §7). Until it
  # lands, and on every push to a fork afterwards, `secrets.*` is empty. The
  # choice is between building nothing and building an unsigned package that
  # says so, and this builds the unsigned one: it proves the packaging works,
  # which is what a per-push job is for. An unsigned .pkg is useless to a user
  # — Gatekeeper refuses it — and it is not published anywhere that implies
  # otherwise.
  #
  # **Notarization runs on tags only.** It is slow and rate-limited, so a
  # per-push notarization queue is a per-push wait; and `--require-signing`
  # goes with it, so a tag can never quietly produce an unsigned artefact.
  macos-package:
    name: macOS package
    runs-on: macos-14
    env:
      VERSION: 0.0.0+git.${{ github.sha }}
      # Lifted to job scope because the `secrets` context is not available in
      # an `if:` condition and a step's own `env:` is not visible to its own
      # `if:` either. Testing `env.X != ''` at job scope is the only way to ask
      # "was this secret configured?" — which is the question that decides
      # whether this build is signed. An unset secret is an empty string, so
      # these are empty on a fork and on any repository that has not yet
      # completed the Apple Developer Program enrolment.
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      # No `targets:` input on purpose. It would add them to `stable`, which is
      # not the toolchain that builds: `rust-toolchain.toml` pins 1.88 and
      # cargo reads the file. `scripts/build-macos-pkg.sh` runs its own
      # `rustup target add`, which honours the pin — do not "simplify" that
      # away in favour of this action, which is exactly the mistake the `macos`
      # job in ci.yml made.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A throwaway keychain, not the login one. The runner is ephemeral, but
      # the login keychain is unlocked for the whole job and every later step
      # would be able to sign with these; a dedicated keychain that is deleted
      # at the end keeps the certificates reachable only where they are used.
      #
      # `.gitignore` blocks `*.p12` and `*.pem` deliberately (SECURITY.md), so
      # the certificates cannot arrive any way but this one.
      - name: Import signing certificates
        if: ${{ env.APPLE_CERT_P12 != '' }}
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/karst-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$keychain" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          # Without this, `codesign` blocks on a GUI prompt that no runner can
          # answer, and the job hangs until its timeout rather than failing.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certs.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Notarization credentials
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.APPLE_NOTARY_KEY != '' }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          echo "$APPLE_NOTARY_KEY" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "KARST_NOTARY_KEY=$key" >> "$GITHUB_ENV"

      - name: Build the package
        env:
          KARST_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          KARST_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          # Tags must be signed and notarized; pushes may not be.
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            ./scripts/build-macos-pkg.sh --require-signing
          else
            ./scripts/build-macos-pkg.sh
          fi

      # Installing the package it just built proves the scripts run as root,
      # the paths are right and the daemon is *not* started without a config —
      # none of which the build itself can show. Gatekeeper is not exercised
      # here and cannot be: a locally-built package passes on the machine that
      # built it for reasons that have nothing to do with a user's, which is
      # why clean-machine verification stays a manual release step.
      - name: Install, verify layout, uninstall
        run: |
          sudo installer -pkg dist/macos/karst-macos-universal.pkg -target /
          test -x /usr/local/bin/karstd
          test -x /usr/local/bin/karst
          test -f /Library/LaunchDaemons/dev.karst.karstd.plist
          test -f /etc/karst/karstd.toml.example
          test -d /var/log/karst
          lipo -archs /usr/local/bin/karstd | tee /dev/stderr | grep -q x86_64
          lipo -archs /usr/local/bin/karstd | grep -q arm64
          # Both binaries run at all. `--help` rather than `--version`, which
          # `karstd` does not accept — an option it does not know is an option
          # it refuses, and the run subcommand is not something to invoke here.
          /usr/local/bin/karstd --help > /dev/null
          /usr/local/bin/karst --help > /dev/null
          # `genkey` is the first thing a new node runs, and it is the one
          # command that exercises the crypto in the installed universal
          # binary rather than just its argument parser.
          #
          # Not `karstd check` on the example config: that file is
          # documentation, its peer keys are placeholders, and it is *meant*
          # to fail validation until an operator fills them in.
          #
          # Measured with `${#key}`, not `wc -c` through a pipe. BSD `wc`
          # right-pads its output, so an empty key prints "       0" and never
          # matches `^0$` — and a pipeline's status is its last command's,
          # since Actions runs `bash -e` without `pipefail`. A check written
          # that way passes whether `genkey` produced a key or crashed.
          key=$(sudo /usr/local/bin/karstd genkey 2>/dev/null)
          # 96 bytes of hex seed: 64 for the ML-KEM key, 32 for X25519.
          [ "${#key}" -ge 192 ] \
            || { echo "::error::genkey produced ${#key} chars, expected >=192"; exit 1; }
          # No config was installed, so the daemon must not be loaded — see the
          # postinstall script for why that is the intended outcome.
          if launchctl print system/dev.karst.karstd >/dev/null 2>&1; then
            echo "::error::the daemon was started with no configuration"
            exit 1
          fi
          sudo /usr/local/bin/karst-uninstall
          test ! -e /usr/local/bin/karstd
          test ! -e /Library/LaunchDaemons/dev.karst.karstd.plist

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ github.sha }}
          path: |
            dist/macos/karst-macos-universal.pkg
            dist/macos/karst-macos-universal.pkg.sha256
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/karst-signing.keychain-db" 2>/dev/null || true

  # Mac App Store submission — wired up, and stubbed.
  #
  # The package `macos-package` builds installs a root LaunchDaemon, and the
  # App Store accepts only sandboxed applications, so it would be rejected on
  # review whatever it is signed with. That is a deliberate architectural
  # choice — plans/phase-5/06-macos-client.md §3 — and the App Store route
  # needs a `NEPacketTunnelProvider` variant that does not exist yet.
  #
  # This job therefore exists to be *ready*: it runs the moment an Apple ID
  # certificate is configured, checks every precondition, and reports precisely
  # what is still missing rather than uploading something that will be
  # rejected. `scripts/appstore-submit-macos.sh` carries the real command
  # sequence, so the remaining work is producing an eligible artefact, not
  # working out how to submit one.
  #
  # It never blocks a release: `continue-on-error`, because a submission that
  # cannot yet succeed must not turn a good build red.
  app-store:
    name: Mac App Store (stub)
    needs: macos-package
    runs-on: macos-14
    continue-on-error: true
    # Tags only. Deliberately *not* also gated on the certificates being
    # present: a job-level `if:` cannot see the `secrets` context, and the
    # script checks for them itself and exits cleanly with an explanation when
    # they are absent — which is the more useful behaviour anyway, since the
    # explanation is the whole point of this job today.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-package-${{ github.sha }}
          path: dist/macos
      - name: Submit
        env:
          KARST_APPSTORE_IDENTITY: ${{ secrets.APPLE_APPSTORE_IDENTITY }}
          KARST_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          KARST_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          if [ -n "$APPLE_NOTARY_KEY" ]; then
            key="$RUNNER_TEMP/notary.p8"
            echo "$APPLE_NOTARY_KEY" | base64 --decode > "$key"
            chmod 600 "$key"
            export KARST_NOTARY_KEY="$key"
          fi
          ./scripts/appstore-submit-macos.sh dist/macos/karst-macos-universal.pkg
