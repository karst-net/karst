name: Temporary rustls lockfile update

on:
  push:
    paths:
      - .github/workflows/fix-rustls-lock.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Update rustls to patched release
        run: cargo update -p rustls --precise 0.23.45
      - name: Verify patched rustls is locked
        run: |
          awk '/name = "rustls"/{found=1} found && /version = /{print; exit}' Cargo.lock | grep '0.23.45'
      - name: Commit updated lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "deps: update rustls to 0.23.45"
          git push
