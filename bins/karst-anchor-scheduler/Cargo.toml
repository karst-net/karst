[package]
name = "karst-anchor-scheduler"
description = "ADR-0045 §4d: the duty-cycle scheduler for ephemeral Local Zone anchors (issue #352)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

publish = false

[lints]
workspace = true

[[bin]]
name = "karst-anchor-scheduler"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
# The same control-API HTTP stack `karst-scaler advise`/`drive` use
# (bins/karst-scaler/src/advise_loop.rs::build_agent/fetch) -- one more HTTP
# stack alongside the AWS SDK's own would be exactly the dependency weight
# this workspace avoids paying twice for the same job.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-native-certs = "0.8"
# This crate only ever calls DescribeInstances/StartInstances/StopInstances
# -- it never provisions, so it needs none of karst-scaler-aws's own
# RunInstances/TerminateInstances/UserData machinery and does not depend on
# that crate or on karst-scaler-driver's `Driver` trait (see this crate's
# own module doc for why: a fixed, pre-provisioned, never-pooled instance
# has no slot in that trait's create/drain/destroy shape).
#
# The exact same pin block as bins/karst-scaler-aws/Cargo.toml, copied
# verbatim per that file's own comment instructing exactly this for any new
# AWS-talking crate in this workspace -- see it for the full MSRV-gap and
# `ring`-vs-`aws-lc-rs` reasoning this repeats without re-deriving.
aws-sdk-ec2 = { version = "=1.177.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-config = { version = "=1.8.13", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-smithy-http-client = { version = "=1.1.9", default-features = false, features = ["rustls-aws-lc"] }
aws-types = "=1.3.11"
aws-credential-types = "=1.2.11"
