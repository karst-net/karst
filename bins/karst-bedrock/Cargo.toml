[package]
name = "karst-bedrock-cli"
description = "Offline Bedrock signer — root and authority key ceremonies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The binary is `karst-bedrock`; the package cannot be, because the library
# crate already claims that name in the workspace.
[[bin]]
name = "karst-bedrock"
path = "src/main.rs"

[lints]
workspace = true

# No network stack, no async runtime, no HTTP client — deliberately. This tool
# runs on a machine that has no network interface, and its dependency list is
# part of that claim rather than an accident of what was convenient.
[dependencies]
karst-bedrock = { workspace = true }
karst-crypto = { workspace = true }
# `getrandom` directly, following bins/karst-relay/src/sign.rs: rand_core 0.10
# ships no OsRng, and pulling in `rand` to call getrandom would add a dependency
# tree to a binary whose short dependency list is part of its claim.
getrandom = "0.3"
sha2 = { version = "0.10", default-features = false }
