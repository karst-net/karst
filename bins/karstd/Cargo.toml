[package]
name = "karstd"
description = "Karst node agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# A library beside the binary: the datapath is worth integration-testing, and a
# `[[bin]]`-only package cannot be imported by `tests/`.
[lib]
name = "karstd"
path = "src/lib.rs"

[[bin]]
name = "karstd"
path = "src/main.rs"

[lints]
workspace = true

# ADR-0030: lets `run.rs` adopt a `karst-tun` `network-extension` fd instead
# of creating a device. Nothing outside `run.rs` needs to know this exists.
[features]
network-extension = ["karst-tun/network-extension"]

[dependencies]
karst-bedrock.workspace = true
karst-control-client.workspace = true
karst-crypto.workspace = true
karst-dns.workspace = true
karst-disco.workspace = true
karst-node.workspace = true
karst-noise.workspace = true
karst-portmap.workspace = true
karst-proto.workspace = true
karst-relay-proto.workspace = true
karst-transport.workspace = true
karst-tun.workspace = true

getrandom = "0.3"
# The netmap's protobuf types come from karst-control-client, which generates
# them from the same .proto the Go server compiles. `prost` is needed here only
# to encode the assembled netmap for the on-disk cache.
prost = "0.14"
# §3.2 of plans/phase-6/08-observability.md: `tracing`, not `log` +
# `env_logger` — its span/event model is the one the OTel Rust SDK consumes,
# so a future client-side trace exporter (§3.3, deferred, not built this
# phase) would not need a second logging migration on top of this one.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
base64ct = { version = "1", features = ["alloc"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", default-features = false }
# The control channel is the only async code in the daemon: tonic is async, and
# reimplementing HTTP/2 to avoid a runtime would be a poor trade. It runs on a
# current-thread runtime on its own thread, so no future touches the datapath.
ml-dsa = "0.1"
sha2 = { version = "0.10", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "time", "net", "io-util", "sync"] }
# This node's own TURN (RFC 8656) allocation — `spec/aven-v1.md` §7.8. The
# webrtc-rs project's crates; `util` is `webrtc-util` under the name its own
# `turn` dependency uses, so `turn::client`'s `Conn` trait and this module's
# are the same type. `conn` is the only feature needed — `vnet` is a virtual
# network for the crate's own tests, not something this daemon uses.
turn = "0.17.2"
util = { package = "webrtc-util", version = "0.17.1", default-features = false, features = ["conn"] }
# Ponor uses a conventional, validated TLS 1.3 hop. The ML-DSA key in the
# relay registry authenticates the relay itself; the system trust store keeps
# the connection compatible with ordinary HTTPS and self-hosted internal CAs.
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs", "prefer-post-quantum"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
# ADR-0020's node-side QUIC dial path — client-only, since a node never
# accepts a QUIC connection. Same `rustls-aws-lc-rs` backend as `tokio-rustls`
# above, for the same reason: `ring` has no X25519MLKEM768.
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
# GitHub issue #170: opt-in client-side OTLP/HTTP trace export. `http-proto`
# (protobuf over plain HTTP, not `grpc-tonic`) so this does not pull in tonic;
# no bundled HTTP-client feature (`reqwest-*`/`hyper-client`) either — a
# hand-rolled `opentelemetry_http::HttpClient` in `trace_export.rs` reuses the
# same blocking rustls stack `dot.rs`/`relay_tls.rs` already use instead of a
# second TLS backend and async HTTP client stack.
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "trace"] }
opentelemetry-http = { version = "0.32", default-features = false }
# 0.33 is not a typo: `tracing-opentelemetry`'s own version numbering has
# drifted from the `opentelemetry` crates' — 0.33.0 is the release that pairs
# with `opentelemetry` 0.32, confirmed against its published `Cargo.toml`.
tracing-opentelemetry = "0.33"
async-trait = "0.1"
http = "1"
# SPKI pin hashing for `[tracing] collector_pin_hex` — the same construction
# `crates/karst-dns/src/forward/tls.rs` already uses for DoT's own pin
# option, reimplemented here rather than shared because that module is
# crate-private to `karst-dns`.
x509-cert = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
karst-ipc.workspace = true
karst-secure-storage.workspace = true
karst-winlog.workspace = true
# The SCM dispatcher/status-handle boilerplate (Mullvad's crate — chosen by
# plan §5 over hand-rolling the `ServiceMain` state machine). Its own unsafe
# FFI stays inside that crate, which is why `karstd` (ADR-0030's
# `#![deny(unsafe_code)]`, narrower than a blanket `allow`) can depend on it
# directly rather than needing a `sys_windows`-pattern wrapper the way
# `karst-ipc`/`karst-secure-storage`/`karst-winlog` do for APIs with no
# existing safe crate.
windows-service = "0.8"

[dev-dependencies]
# The relay, as a library, so `tests/relay_live.rs` can run a real one in
# process. The node's Ponor client had only stub-signer unit tests before that;
# nothing had ever put it on a socket.
karst-relay = { path = "../karst-relay" }
karst-noise.workspace = true
# Already a dev-dependency of karst-relay, and used here for the same reason:
# testing what a relay's certificate does needs a certificate.
rcgen = "0.14"
hickory-proto = { version = "0.26.1", default-features = false }
# Drives `trace_export::Client::send_bytes` synchronously in its own tests —
# the same executor `opentelemetry_sdk`'s batch processor itself uses to
# drive the trait's `async fn` from a plain `std::thread`, not a Tokio
# runtime.
futures-executor = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
