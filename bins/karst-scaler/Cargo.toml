[package]
name = "karst-scaler"
description = "ADR-0045 Phase 0 cost model/simulator and Phase 1's Advisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

publish = false

# A library beside the binary, matching bins/karst-relay's shape: the cost
# engine is worth integration-testing on its own, and a `[[bin]]`-only
# package cannot be imported from `tests/`.
[lib]
name = "karst_scaler"
path = "src/lib.rs"

[[bin]]
name = "karst-scaler"
path = "src/main.rs"

[lints]
workspace = true

# Phase 0 is an offline tool: no network stack, no async runtime, no cloud
# SDK. It reads two files and prints a report. Keeping the dependency list
# this short is itself part of ADR-0045 §4c/§6's posture — a planner-adjacent
# tool earns credentials and a network dependency only in later phases.
#
# Phase 1's `advise` subcommand (bin target only; the library stays as
# described above) is the first exception: it polls the control server's own
# read-only demand endpoints over plain outbound HTTPS with a read-scoped
# PAT -- still no cloud credentials, still no driver, per §7 Phase 1's own
# "actuates nothing" scope. ureq (blocking) rather than a tokio-based client:
# a poll loop has no concurrency to speak of, and pulling in an async
# runtime for one sequential GET per tick would be the dependency weight
# this section exists to avoid paying.
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# ureq's own default `rustls` feature bundles its own crypto provider
# (`ring`) and its own bundled Mozilla root-certificate list
# (`webpki-roots`, and `platform-verifier`'s own fallback pulls in the same
# roots under the name `webpki-root-certs`). Neither matches this
# workspace's existing choices: every other crate here picks `aws-lc-rs`
# for its crypto provider (feature unification would otherwise silently
# compile `ring` into every other crate's own copy of `rustls` too --
# confirmed: it broke karst-dns's TLS-pinning tests under
# `cargo test --workspace` while that crate's own `-p karst-dns` run stayed
# green), and the bundled Mozilla root list carries a CDLA-Permissive-2.0
# license this repo's dependency policy (deny.toml, ADR-0003/ADR-0007) does
# not allow -- confirmed by the `Dependency policy` CI job rejecting it.
# `rustls-no-provider` opts ureq out of choosing either: `advise_loop.rs`
# builds its own `Agent` with `aws-lc-rs` installed explicitly and root
# certs loaded via `rustls-native-certs`, the crate every other crate here
# already uses for exactly this (`bins/karst-relay/src/tls.rs`,
# `bins/karstd/src/relay_tls.rs`).
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-native-certs = "0.8"
# `metrics_http`'s `GET /recommendations` — the same `Recommendation` the
# Prometheus text rendering also carries, as JSON. ureq's own "json" feature
# above already pulls this crate in transitively (for `body_mut().read_json`
# on the inbound side); this is the explicit, direct dependency a 2021-edition
# crate needs to `use` it itself.
serde_json = "1"
