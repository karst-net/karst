[package]
name = "karst-scaler"
description = "ADR-0045 Phase 0: cost model schema and offline spend simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

publish = false

# A library beside the binary, matching bins/karst-relay's shape: the cost
# engine is worth integration-testing on its own, and a `[[bin]]`-only
# package cannot be imported from `tests/`.
[lib]
name = "karst_scaler"
path = "src/lib.rs"

[[bin]]
name = "karst-scaler"
path = "src/main.rs"

[lints]
workspace = true

# Phase 0 is an offline tool: no network stack, no async runtime, no cloud
# SDK. It reads two files and prints a report. Keeping the dependency list
# this short is itself part of ADR-0045 §4c/§6's posture — a planner-adjacent
# tool earns credentials and a network dependency only in later phases, and
# this one has neither.
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
